[package]
edition = "2024"
rust-version = "1.85"
name = "a2a-cli"
version = "0.1.6"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Standalone A2A CLI client"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/a2aproject/a2a-rs"
resolver = "2"

[features]
default = ["rustls-tls"]
native-tls = [
    "a2a-client/native-tls",
    "reqwest/native-tls",
]
rustls-tls = [
    "a2a-client/rustls-tls",
    "reqwest/rustls",
]

[lib]
