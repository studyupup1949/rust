[dependencies.a2a]
version = "0.3.0"
package = "a2a-lf"

[dependencies.a2a-client]
version = "0.2.0"
default-features = false
package = "a2a-client-lf"

[dependencies.clap]
version = "4.5"
features = [
    "derive",
    "env",
]

[dependencies.futures]
version = "0.3"

[dependencies.reqwest]
version = "0.13"
features = [
    "json",
    "stream",
    "charset",
    "http2",
    "system-proxy",
    "query",
]
