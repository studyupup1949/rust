[package]
edition = "2024"
name = "a2fuse"
version = "0.2.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Mount and maintain Apple II ProDOS disk images"
readme = "README.md"
license = "MIT"
repository = "https://github.com/markassad/a2fuse"

[features]
