name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify tag and package version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Check embedded JavaScript
        run: |
          awk '1' \
            src/workflow/retrieval_foundation.js \
            src/workflow/retrieval_web.js \
            src/workflow/retrieval_selection.js \
            src/workflow/retrieval_reduction.js \
            src/workflow/retrieval_materialization.js \
            src/workflow/retrieval_loop.js \
            src/workflow/retrieval_local.js \
            src/workflow/retrieval_local_collection.js \
            src/workflow/retrieval_execution.js |
            node --check -
          node --check src/workflow/generation.js
      - name: Build release package
        run: cargo package --locked
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "target/package/a3s-deep-research-${VERSION}.crate" \
            --generate-notes \
            --title "A3S DeepResearch ${GITHUB_REF_NAME}" \
            --verify-tag
