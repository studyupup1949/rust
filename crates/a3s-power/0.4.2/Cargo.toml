[package]
edition = "2021"
name = "a3s-power"
version = "0.4.2"
authors = ["A3S Lab"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A3S Power — Privacy-preserving LLM inference for TEE environments"
readme = "README.md"
keywords = [
    "llm",
    "inference",
    "tee",
    "privacy",
    "gguf",
]
categories = ["web-programming::http-server"]
license = "MIT"
repository = "https://github.com/A3S-Lab/Power"

[features]
default = ["mistralrs"]
hf = []
hw-verify = [
    "dep:x509-cert",
    "dep:p384",
    "dep:p256",
]
llamacpp = [
    "dep:llama-cpp-2",
    "dep:encoding_rs",
    "llama-cpp-2?/mtmd",
]
mistralrs = ["dep:mistralrs"]
picolm = [
    "dep:memmap2",
    "dep:half",
    "dep:rayon",
]
tee-minimal = [
    "picolm",
    "tls",
    "vsock",
]
tls = [
    "dep:axum-server",
    "dep:rcgen",
    "dep:time",
]
vsock = ["dep:tokio-vsock"]

[lib]
name = "a3s_power"
path = "src/lib.rs"

[[bin]]
name = "a3s-power"
path = "src/main.rs"

[[bin]]
name = "a3s-power-verify"
path = "src/bin/a3s-power-verify.rs"

[[example]]
name = "box_integration"
path = "examples/box_integration.rs"

[[example]]
name = "dump_gguf"
path = "examples/dump_gguf.rs"

[[test]]
name = "epc_routing"
path = "tests/epc_routing.rs"

[[test]]
name = "gguf_builder"
path = "tests/gguf_builder.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "picolm_real"
path = "tests/picolm_real.rs"

[[test]]
name = "picolm_tee"
path = "tests/picolm_tee.rs"

[[test]]
name = "streaming_decrypt"
path = "tests/streaming_decrypt.rs"

[[bench]]
name = "layer_stream"
path = "benches/layer_stream.rs"
harness = false

[[bench]]
name = "tee_memory"
path = "benches/tee_memory.rs"
harness = false

