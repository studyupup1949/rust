[package]
edition = "2021"
name = "a3s"
version = "0.1.1"
authors = ["A3S Lab"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "a3s dev — local development orchestration tool for the A3S monorepo"
readme = "README.md"
