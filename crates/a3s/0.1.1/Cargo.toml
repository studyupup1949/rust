    "http1",
    "server",
    "client",
]

[dependencies.hyper-util]
version = "0.1"
features = [
    "server-auto",
    "tokio",
    "client-legacy",
]

[dependencies.indexmap]
version = "2"
features = ["serde"]

[dependencies.libc]
version = "0.2"

[dependencies.minijinja]
version = "2"

[dependencies.nix]
