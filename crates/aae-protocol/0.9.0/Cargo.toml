[package]
edition = "2021"
rust-version = "1.75"
name = "aae-protocol"
version = "0.9.0"
authors = ["Brent Ellis <brent@r3motely.net>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Accountable Agentic Execution — protocol SDK for Rust"
documentation = "https://docs.rs/aae-protocol"
readme = "README.md"
keywords = [
    "agent",
    "ai",
    "governance",
    "policy",
    "audit",
]
categories = [
    "api-bindings",
    "authentication",
]
license = "MIT OR Apache-2.0"
