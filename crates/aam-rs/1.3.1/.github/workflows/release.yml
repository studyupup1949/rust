name: Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish to crates.io even if no new version is detected (useful for hotfixes or manual releases)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Tests, Formatting & Security
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install Rust toolchain
          uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt

        - name: Setup Rust cache
          uses: Swatinem/rust-cache@v2

        - name: Check formatting
          run: cargo fmt --all -- --check

        - name: Run tests
          run: cargo test --all-targets --all-features

        - name: Security audit (cargo-deny)
          uses: EmbarkStudios/cargo-deny-action@v2
          with:
            command: check bans licenses
    runs-on: ubuntu-latest

  release-please:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: rust

  publish-cargo:
      needs: release-please
      if: ${{ needs.release-please.outputs.release_created == 'true' }}
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: dtolnay/rust-toolchain@stable
        - run: cargo publish --token ${{ secrets.CRATES_TOKEN }} --no-verify

  build-c-libs:
      needs: release-please
      if: ${{ needs.release-please.outputs.release_created == 'true' || github.event.inputs.force_publish == 'true' }}
      strategy:
        matrix:
          include:
            - os: ubuntu-latest
              artifact_name: mylib-linux-x86_64
              lib_name: libmylib.so
            - os: macos-latest
              artifact_name: mylib-macos-x86_64
              lib_name: libmylib.dylib
            - os: windows-latest
              artifact_name: mylib-windows-x86_64
              lib_name: mylib.dll
      runs-on: ${{ matrix.os }}
      defaults:
        run:
          shell: bash

      steps:
        - uses: actions/checkout@v4

        - name: Install Rust toolchain
          uses: dtolnay/rust-toolchain@stable

        - name: Install cargo-binstall
          uses: cargo-bins/cargo-binstall@main
        - name: Install cbindgen
          run: cargo binstall cbindgen -y

        - name: Build release library
          run: cargo build --release --locked

        - name: Prepare C/C++ Package Structure
          run: |
            mkdir -p package/include package/lib package/bin

            cbindgen --config cbindgen.toml --crate ${{ github.event.repository.name }} --output package/include/mylib.h

            if [ "${{ runner.os }}" == "Windows" ]; then
              cp target/release/mylib.dll package/bin/
              cp target/release/mylib.dll.lib package/lib/ # Важно для MSVC!
            elif [ "${{ runner.os }}" == "macOS" ]; then
              cp target/release/libmylib.dylib package/lib/
            else
              cp target/release/libmylib.so package/lib/
            fi

        - name: Zip Package
          run: |
            cd package
            zip -r ../${{ matrix.artifact_name }}.zip ./*
  
        - name: Upload Release Artifact
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ needs.release-please.outputs.tag_name }}
            files: ${{ matrix.artifact_name }}.zip
