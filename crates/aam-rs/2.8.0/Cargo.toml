[package]
edition = "2024"
rust-version = "1.89.0"
name = "aam-rs"
version = "2.8.0"
authors = ["Nikita Goncharov <ininids@ininids.in.rs>"]
build = "build.rs"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "examples/**/*",
    "tests/**/*",
    "build.rs",
    "CHANGELOG.md",
    "PUBLIC_API.md",
    "cbindgen.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Rust implementation of the Abstract Alias Mapping (AAM) framework for aliasing and maping aam files."
readme = "README.md"
keywords = [
    "aam",
    "alias",
    "mapping",
    "config",
    "parser",
]
categories = [
    "data-structures",
    "parsing",
    "config",
]
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/aam-rs/aam-rs"
resolver = "2"

[features]
64bit = ["aam-core/64bit"]
aot = ["aam-core/aot"]
builder-extras = ["aam-core/builder-extras"]
csharp = [
    "aam-core/ffi",
    "dep:csbindgen",
]
default = [
    "aam-core/default",
    "aot",
]
dev = ["aam-core/dev"]
ffi = ["aam-core/ffi"]
hash-ahash = ["aam-core/hash-ahash"]
hash-fx = ["aam-core/hash-fx"]
hash-rapidhash = ["aam-core/hash-rapidhash"]
hash-ripemd = ["aam-core/hash-ripemd"]
hash-std = ["aam-core/hash-std"]
jni = ["aam-core/jni"]
legacy = ["aam-core/legacy"]
parallel = ["aam-core/parallel"]
perf-hash = ["aam-core/perf-hash"]
python = ["aam-core/python"]
reconstructer = ["aam-core/reconstructer"]
release = ["aam-core/release"]
rust-only = ["aam-core/rust-only"]
serde = ["aam-core/serde"]
splitter = ["aam-core/splitter"]
translator = ["aam-core/translator"]
unsafe_fast_path = ["aam-core/unsafe_fast_path"]

[lib]
name = "aam_rs"
crate-type = [
    "cdylib",
    "rlib",
    "staticlib",
]
path = "src/lib.rs"

