name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: rust

  publish-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: aam
            asset_name: aam-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: aam
            asset_name: aam-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: aam
            asset_name: aam-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: aam.exe
            asset_name: aam-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ needs.release-please.outputs.tag_name }}

      - name: Create tar.gz archive (cargo-binstall)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          tar czf "target/aam-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" \
            "${{ matrix.artifact_name }}"

      - name: Create zip archive (cargo-binstall)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          7z a "target/aam-${{ matrix.target }}.zip" \
            "./target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"

      - name: Upload archive to release (cargo-binstall)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aam-${{ matrix.target }}.${{ matrix.os == 'windows-latest' && 'zip' || 'tar.gz' }}
          asset_name: aam-${{ matrix.target }}.${{ matrix.os == 'windows-latest' && 'zip' || 'tar.gz' }}
          tag: ${{ needs.release-please.outputs.tag_name }}

  publish-rpm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          cargo install cargo-generate-rpm

      - name: Build binary
        run: cargo build --release

      - name: Build RPM
        run: cargo generate-rpm

      - name: Upload RPM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            target/generate-rpm/*.rpm

  publish-deb:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build binary
        run: cargo build --release

      - name: Build DEB
        run: cargo deb

      - name: Upload DEB to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            target/debian/*.deb

  publish-pkgbuild:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set PKGBUILD version
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD

      - name: Upload PKGBUILD to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: PKGBUILD
          asset_name: PKGBUILD
          tag: ${{ needs.release-please.outputs.tag_name }}

  publish-crates:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
