[package]
edition = "2021"
rust-version = "1.65"
name = "aarty"
version = "0.5.0"
authors = ["Anas Elgarhy <anas.elgarhy.dev@gmail.com>"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]
autobins = false
description = "Mini-framework to display pictures on your terminal"
readme = "README.md"
keywords = [
    "ascii",
    "art",
    "image",
    "pictures",
]
categories = [
    "command-line-utilities",
    "multimedia",
    "text-processing",
]
license = "MIT"
repository = "https://github.com/0x61nas/aarty"

[[bin]]
name = "aarty"
