[dependencies.rayon]
version = ">=1.1"
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dev-dependencies.criterion]
version = "0.8.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
