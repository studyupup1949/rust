[package]
edition = "2021"
rust-version = "1.85.1"
name = "aarty"
version = "0.8.2"
authors = ["Anas Elgarhy <anas.elgarhy.dev@gmail.com>"]
build = false
include = [
    "src/**/*",
    "benches/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Mini-framework to display pictures on your terminal"
readme = "README.md"
keywords = [
    "ascii",
    "art",
    "image",
    "pictures",
]
categories = [
    "command-line-utilities",
    "multimedia",
    "text-processing",
]
license = "MIT"
repository = "https://github.com/0x61nas/aarty"

[features]
colors = []
default = [
    "colors",
    "reverse",
    "image",
    "text_image",
]
image = [
    "dep:image",
    "rayon",
    "cfg-if",
]
reverse = []
serde = ["dep:serde"]
text_image = []

[lib]
name = "aarty"
path = "src/lib.rs"

[[bin]]
name = "aarty"
path = "src/bin/main.rs"
required-features = [
    "image",
    "colors",
]

[[bench]]
name = "convert_to_ascii"
path = "benches/convert_to_ascii.rs"
