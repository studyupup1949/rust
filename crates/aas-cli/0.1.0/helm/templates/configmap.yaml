apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aas.fullname" . }}-config
  labels:
    {{- include "aas.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "version": {{ .Values.config.version | quote }},
      "metadata": {
        "created_at": "{{ now | date "2006-01-02T15:04:05Z07:00" }}"
      },
      "llm": {
        "provider": {{ .Values.config.llm.provider | quote }},
        "endpoint": "https://api.anthropic.com",
        "model_name": {{ .Values.config.llm.model_name | quote }},
        "timeout_seconds": {{ .Values.config.llm.timeout_seconds }},
        "fallback_provider": "mock"
      },
      "agents": {
        "repository": {
          "enabled": {{ .Values.config.agents.repository.enabled }},
          "detection_interval": {{ .Values.config.agents.repository.detection_interval | quote }},
          "platforms": ["github"],
          "auto_commit": {{ .Values.config.agents.repository.auto_commit }},
          "require_pr_approval": {{ .Values.config.agents.repository.require_pr_approval }},
          "max_actions_per_run": 1,
          "local_repos": []
        },
        "health": {
          "enabled": {{ .Values.config.agents.health.enabled }},
          "detection_interval": {{ .Values.config.agents.health.detection_interval | quote }},
          "endpoints": [],
          "auto_restart": {{ .Values.config.agents.health.auto_restart }},
          "max_restart_attempts": 2,
          "restart_backoff_seconds": [5, 10]
        },
        "logs": {
          "enabled": {{ .Values.config.agents.logs.enabled }},
          "detection_interval": {{ .Values.config.agents.logs.detection_interval | quote }},
          "sources": [],
          "error_threshold": {
            "count": 10,
            "time_window": "1m"
          },
          "auto_fix": false,
          "escalate_on_unknown": true
        },
        "metrics": {
          "enabled": {{ .Values.config.agents.metrics.enabled }},
          "detection_interval": {{ .Values.config.agents.metrics.detection_interval | quote }},
          "providers": [],
          "thresholds": {
            "cpu_percent": 80.0,
            "memory_percent": 85.0,
            "disk_percent": 90.0,
            "latency_ms": 1000,
            "error_rate_percent": 5.0
          },
          "auto_scale": false,
          "optimization_enabled": false
        },
        "task": {
          "enabled": {{ .Values.config.agents.task.enabled }},
          "detection_interval": "10m",
          "auto_execute": false
        },
        "trace": {
          "enabled": {{ .Values.config.agents.trace.enabled }},
          "detection_interval": "5m"
        }
      },
      "execution": {
        "mode": {{ .Values.config.execution.mode | quote }},
        "local_only": true,
        "max_concurrent_actions": {{ .Values.config.execution.max_concurrent_actions }},
        "approval_required_for": {{ .Values.config.execution.approval_required_for | toJson }},
        "rollback_enabled": {{ .Values.config.execution.rollback_enabled }},
        "rollback_timeout_minutes": {{ .Values.config.execution.rollback_timeout_minutes }}
      },
      "learning": {
        "enabled": {{ .Values.config.learning.enabled }},
        "storage": "sqlite",
        "db_path": "/root/.aas/aas.db",
        "prediction_enabled": {{ .Values.config.learning.prediction_enabled }},
        "prediction_confidence_threshold": {{ .Values.config.learning.prediction_confidence_threshold }},
        "memory_retention_days": 90,
        "auto_learn": true
      },
      "notifications": {
        "channels": [],
        "triggers": {
          "on_action": true,
          "on_failure": true,
          "on_pattern_learned": false
        }
      },
      "advanced": {
        "enable_telemetry": false,
        "metrics_port": 9090
      }
    }
