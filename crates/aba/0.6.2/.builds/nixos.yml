image: nixos/unstable

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  PROJECT_NAME: "aba"
  GIT_PUSH_URL: "git@git.sr.ht:~onemoresuza/aba"
  VERSION_CMD: "cargo pkgid | cut -d'#' -f2"
  CACHIX_BIN_CACHE: "rust-deps"

secrets:
  - b9d05891-f72c-4697-a908-d0f9c5334d60 # ssh key
  - f1895886-cbc7-46a8-b70f-797e1b707946 # cachix token

oauth: "git.sr.ht/OBJECTS:RW git.sr.ht/REPOSITORIES:RO git.sr.ht/PROFILE:RO"

tasks:
  - setup-cachix: |
      cd "${PROJECT_NAME}"
      nix develop .#build --command cachix use nix-community
      nix develop .#build --command cachix use "${CACHIX_BIN_CACHE}"
  - reuse-lint: |
      cd "${PROJECT_NAME}"
      nix develop .#build --command reuse lint
  - run-nix-flake-check: |
      cd "${PROJECT_NAME}"
      nix flake -L check
  - test-basic-functionality: |
      cd "${PROJECT_NAME}"
      nix build -L .
      nix run -L . -- --help
      nix run -L . -- --version
  - push-to-cachix: |
      cd "${PROJECT_NAME}"
      nix run -L .#pushToCachix -- .#artifacts .#default
  - generate-git-tag: |
      cd "${PROJECT_NAME}"
      nix run -L .#genGitTagAndChangelog
  - upload-artifacts: |
      if [[ -n "${GIT_TAG_GENERATED}" ]]; then
        cd "${PROJECT_NAME}"
        nix run -L .#uploadArtifacts
        nix run -L .#pushToCachix -- .#abaMusl
      fi
