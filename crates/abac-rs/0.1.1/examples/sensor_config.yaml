# Environmental sensor monitoring configuration
# This file defines sensor types and their associated alert conditions

sensor_types:
  # Greenhouse sensors - monitor temperature and humidity
  - name: greenhouse
    alerts:
      - name: greenhouse-heat
        description: "Temperature >= 40.0°C"
        sensor_group: greenhouse
        measurement: temperature
        threshold:
          type: float
          value: 40.0
        comparison: above

      - name: greenhouse-dry
        description: "Humidity <= 30.0%"
        sensor_group: greenhouse
        measurement: humidity
        threshold:
          type: float
          value: 30.0
        comparison: below

      - name: greenhouse-frost
        description: "Temperature <= 5.0°C"
        sensor_group: greenhouse
        measurement: temperature
        threshold:
          type: float
          value: 5.0
        comparison: below

  # Warehouse sensors - temperature monitoring
  - name: warehouse
    alerts:
      - name: warehouse-heat
        description: "Temperature >= 35.0°C"
        sensor_group: warehouse
        measurement: temperature
        threshold:
          type: float
          value: 35.0
        comparison: above

      - name: warehouse-cold
        description: "Temperature <= 0.0°C"
        sensor_group: warehouse
        measurement: temperature
        threshold:
          type: float
          value: 0.0
        comparison: below

  # Outdoor weather sensors - wind, light, and temperature
  - name: outdoor
    alerts:
      - name: outdoor-storm
        description: "Wind speed >= 80.0 km/h"
        sensor_group: outdoor
        measurement: wind_speed
        threshold:
          type: float
          value: 80.0
        comparison: above

      - name: outdoor-dark
        description: "Light level <= 10"
        sensor_group: outdoor
        measurement: light_level
        threshold:
          type: integer
          value: 10
        comparison: below

      - name: outdoor-extreme-heat
        description: "Temperature >= 45.0°C"
        sensor_group: outdoor
        measurement: temperature
        threshold:
          type: float
          value: 45.0
        comparison: above

  # Data center sensors - temperature and humidity critical monitoring
  - name: datacenter
    alerts:
      - name: datacenter-overheat
        description: "Temperature >= 28.0°C"
        sensor_group: datacenter
        measurement: temperature
        threshold:
          type: float
          value: 28.0
        comparison: above

      - name: datacenter-humid
        description: "Humidity >= 60.0%"
        sensor_group: datacenter
        measurement: humidity
        threshold:
          type: float
          value: 60.0
        comparison: above

      - name: datacenter-dry
        description: "Humidity <= 20.0%"
        sensor_group: datacenter
        measurement: humidity
        threshold:
          type: float
          value: 20.0
        comparison: below
