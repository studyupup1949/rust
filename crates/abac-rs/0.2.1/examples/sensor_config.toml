# Environmental sensor monitoring configuration (TOML format)
# This file defines sensor types and their associated alert conditions

[[sensor_types]]
name = "greenhouse"

[[sensor_types.alerts]]
name = "greenhouse-heat"
description = "Temperature >= 40.0°C"
sensor_group = "greenhouse"
measurement = "temperature"
comparison = "above"

[sensor_types.alerts.threshold]
type = "float"
value = 40.0

[[sensor_types.alerts]]
name = "greenhouse-dry"
description = "Humidity <= 30.0%"
sensor_group = "greenhouse"
measurement = "humidity"
comparison = "below"

[sensor_types.alerts.threshold]
type = "float"
value = 30.0

[[sensor_types.alerts]]
name = "greenhouse-frost"
description = "Temperature <= 5.0°C"
sensor_group = "greenhouse"
measurement = "temperature"
comparison = "below"

[sensor_types.alerts.threshold]
type = "float"
value = 5.0

# Warehouse sensors
[[sensor_types]]
name = "warehouse"

[[sensor_types.alerts]]
name = "warehouse-heat"
description = "Temperature >= 35.0°C"
sensor_group = "warehouse"
measurement = "temperature"
comparison = "above"

[sensor_types.alerts.threshold]
type = "float"
value = 35.0

[[sensor_types.alerts]]
name = "warehouse-cold"
description = "Temperature <= 0.0°C"
sensor_group = "warehouse"
measurement = "temperature"
comparison = "below"

[sensor_types.alerts.threshold]
type = "float"
value = 0.0

# Outdoor weather sensors
[[sensor_types]]
name = "outdoor"

[[sensor_types.alerts]]
name = "outdoor-storm"
description = "Wind speed >= 80.0 km/h"
sensor_group = "outdoor"
measurement = "wind_speed"
comparison = "above"

[sensor_types.alerts.threshold]
type = "float"
value = 80.0

[[sensor_types.alerts]]
name = "outdoor-dark"
description = "Light level <= 10"
sensor_group = "outdoor"
measurement = "light_level"
comparison = "below"

[sensor_types.alerts.threshold]
type = "integer"
value = 10

[[sensor_types.alerts]]
name = "outdoor-extreme-heat"
description = "Temperature >= 45.0°C"
sensor_group = "outdoor"
measurement = "temperature"
comparison = "above"

[sensor_types.alerts.threshold]
type = "float"
value = 45.0

# Data center sensors
[[sensor_types]]
name = "datacenter"

[[sensor_types.alerts]]
name = "datacenter-overheat"
description = "Temperature >= 28.0°C"
sensor_group = "datacenter"
measurement = "temperature"
comparison = "above"

[sensor_types.alerts.threshold]
type = "float"
value = 28.0

[[sensor_types.alerts]]
name = "datacenter-humid"
description = "Humidity >= 60.0%"
sensor_group = "datacenter"
measurement = "humidity"
comparison = "above"

[sensor_types.alerts.threshold]
type = "float"
value = 60.0

[[sensor_types.alerts]]
name = "datacenter-dry"
description = "Humidity <= 20.0%"
sensor_group = "datacenter"
measurement = "humidity"
comparison = "below"

[sensor_types.alerts.threshold]
type = "float"
value = 20.0
