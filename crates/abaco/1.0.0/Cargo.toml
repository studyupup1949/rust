[package]
edition = "2024"
rust-version = "1.89"
name = "abaco"
version = "1.0.0"
build = false
exclude = [
    ".claude/",
    "target/",
    "docs/",
    "scripts/",
    "bench-history.csv",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Math engine — expression evaluation, unit conversion, and numeric types for Rust"
homepage = "https://github.com/MacCracken/abaco"
documentation = "https://docs.rs/abaco"
readme = "README.md"
keywords = [
    "math",
    "calculator",
    "units",
    "conversion",
    "expression",
]
categories = [
    "mathematics",
    "science",
]
license = "AGPL-3.0-only"
repository = "https://github.com/MacCracken/abaco"

[features]
ai = [
    "dep:chrono",
    "dep:serde_json",
    "dep:reqwest",
    "dep:tokio",
]
default = []
full = ["ai"]

[lib]
name = "abaco"
path = "src/lib.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[bench]]
name = "benchmarks"
path = "benches/benchmarks.rs"
harness = false

[dependencies.chrono]
version = "0.4"
features = ["serde"]
optional = true

[dependencies.reqwest]
version = "0.12"
features = [
    "json",
    "rustls-tls",
]
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
]
optional = true

[dependencies.tracing]
version = "0.1"

[dev-dependencies.criterion]
version = "0.5"
features = ["html_reports"]
