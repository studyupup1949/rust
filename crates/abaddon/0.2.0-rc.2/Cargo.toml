[package]
edition = "2021"
rust-version = "1.91"
name = "abaddon"
version = "0.2.0-rc.2"
authors = ["Daemoniorum Engineering <engineering@daemoniorum.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "LLM inference engine - The Destroyer renders judgment"
readme = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Daemoniorum-LLC/infernum"

[features]
accelerate = ["candle-core/accelerate"]
cpu = []
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "dep:cudarc",
]
cuda-experimental = ["cuda"]
default = ["cpu"]
flash-attn = [
    "cuda",
    "dep:candle-flash-attn",
]
haagenti-gpu = [
    "cuda",
    "dep:haagenti-cuda",
]
llama-cpp = ["dep:llama_cpp"]
llama-cpp-cuda = [
    "llama-cpp",
    "llama_cpp/cuda",
]
llama-cpp-metal = [
    "llama-cpp",
    "llama_cpp/metal",
]
llama-cpp-vulkan = [
    "llama-cpp",
    "llama_cpp/vulkan",
]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]
mkl = ["candle-core/mkl"]
neural-compression = []

