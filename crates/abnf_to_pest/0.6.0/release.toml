push = false
publish = true
allow-branch = ["main"]
dependent-version = "upgrade"
pre-release-commit-message = "release: bump versions"

[[pre-release-replacements]]
file = "src/lib.rs"
search = "\\[doc\\(html_root_url = .*\\)\\]"
replace = "[doc(html_root_url = \"https://docs.rs/{{crate_name}}/{{version}}\")]"
exactly = 1
