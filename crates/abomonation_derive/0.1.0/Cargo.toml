[package]
name = "abomonation_derive"
version = "0.1.0"
authors = ["Michael Layzell <michael@thelayzells.com>"]
description = "macros 1.1 derive crate for abomonation"
repository = "https://github.com/mystor/abomonation_derive"
documentation = "https://docs.rs/abomonation_derive/"
license = "MIT"
keywords = ["abomonation", "derive", "serialize", "deserialize"]

[lib]
name = "abomonation_derive"
proc-macro = true

[dependencies]
syn = "0.9"
quote = "0.3"
synstructure = "0.2"

[dev-dependencies]
abomonation = "0.4"
