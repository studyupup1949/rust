name: Integración Continua

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Instalar Rust estable
      uses: dtolnay/rust-toolchain@stable

    - name: Ejecutar pruebas
      run: cargo test --verbose

  fmt-clippy:
    name: Formato y Buenas Prácticas
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Instalar Rust con componentes adicionales
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Verificar formato del código
      run: cargo fmt -- --check

    - name: Ejecutar linter (Clippy)
      run: cargo clippy -- -D warnings
