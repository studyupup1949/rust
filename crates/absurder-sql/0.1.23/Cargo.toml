[package]
edition = "2024"
rust-version = "1.85.0"
name = "absurder-sql"
version = "0.1.23"
authors = ["Nicholas G. Piesco"]
build = false
exclude = [
    "pwa/",
    "pwa/.next/",
    "pwa/node_modules/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "AbsurderSQL - SQLite + IndexedDB that's absurdly better than absurd-sql"
readme = "README.md"
license = "AGPL-3.0"
repository = "https://github.com/npiesco/absurder-sql"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[features]
bundled-sqlite = [
    "rusqlite",
    "rusqlite/bundled",
]
default = [
    "console_error_panic_hook",
    "console_log",
    "bundled-sqlite",
]
encryption = [
    "rusqlite",
    "rusqlite/sqlcipher",
]
encryption-commoncrypto = [
    "rusqlite",
    "rusqlite/bundled-sqlcipher",
]
encryption-ios = ["encryption-commoncrypto"]
fs_persist = []
telemetry = [
    "prometheus",
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-prometheus",
]

[lib]
name = "absurder_sql"
crate-type = [
    "cdylib",
    "rlib",
]
path = "src/lib.rs"

