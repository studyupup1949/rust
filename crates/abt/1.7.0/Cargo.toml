[package]
edition = "2021"
name = "abt"
version = "1.7.0"
authors = ["nervosys"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "AgenticBlockTransfer — agentic-first CLI successor to dd, human-first GUI/TUI successor to balenaEtcher, Ventoy, Rufus, Fedora Media Writer, and rpi-imager"
readme = "README.md"
keywords = [
    "disk",
    "flash",
    "image",
    "usb",
    "block-transfer",
]
categories = [
    "command-line-utilities",
    "hardware-support",
    "filesystem",
]
license = "AGPL-3.0-only"
repository = "https://github.com/nervosys/AgenticBlockTransfer"

[features]
cli = []
default = [
    "cli",
    "tui",
    "gui",
]
gui = [
    "dep:eframe",
    "dep:egui",
    "dep:rfd",
]
tui = [
    "dep:ratatui",
    "dep:crossterm",
]

[lib]
name = "abt"
path = "src/lib.rs"

[[bin]]
name = "abt"
path = "src/main.rs"

[[test]]
name = "core_tests"
path = "tests/core_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "verification_proptest"
path = "tests/verification_proptest.rs"

