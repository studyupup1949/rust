[package]
edition = "2021"
rust-version = "1.88"
name = "abtop"
version = "0.5.2"
authors = ["Tae Hwan Jung <nlkey2022@gmail.com>"]
build = false
exclude = [
    "assets/*",
    "assets/**/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "AI agent monitor for your terminal"
homepage = "https://github.com/graykode/abtop"
readme = "README.md"
keywords = [
    "tui",
    "monitor",
    "claude",
    "ai",
    "agent",
]
categories = ["command-line-utilities"]
license = "MIT"
repository = "https://github.com/graykode/abtop"

[lib]
name = "abtop"
path = "src/lib.rs"

[[bin]]
name = "abtop"
path = "src/main.rs"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.crossterm]
version = "0.28"

[dependencies.dirs]
version = "6"

[dependencies.ratatui]
version = "0.29"

[dependencies.serde]
version = "1"
