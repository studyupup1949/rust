[package]
edition = "2021"
rust-version = "1.75"
name = "abyo-crdt"
version = "0.4.0-alpha.1"
authors = ["abyo software, LLC"]
build = false
exclude = [
    "abyo_crdt_plan.md",
    "fuzz/**",
    "tests/*.proptest-regressions",
    ".github/**",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Pure Rust CRDT library: Fugue-Maximal list, OR-Set, LWW-Map, PN-Counter, Peritext rich text, Yjs Delta interop, anchor-based cursors, undo/redo, AVL OST for O(log N) ops"
documentation = "https://docs.rs/abyo-crdt"
readme = "README.md"
keywords = [
    "crdt",
    "collaboration",
    "fugue",
    "peritext",
    "local-first",
]
categories = [
    "data-structures",
    "concurrency",
    "text-editors",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/abyo-software/abyo-crdt"

[features]
default = [
    "serde",
    "storage",
]
serde = [
    "dep:serde",
    "smallvec/serde",
]
storage = [
    "serde",
    "dep:bincode",
]

[lib]
name = "abyo_crdt"
path = "src/lib.rs"

