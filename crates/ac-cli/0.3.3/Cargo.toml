[package]
edition = "2021"
rust-version = "1.80"
name = "ac-cli"
version = "0.3.3"
build = false
exclude = [
    ".github/",
    "tests/",
    "projects/",
    "scripts/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
default-run = "ac"
description = "Apple Container project runner: a docker-compatible CLI and compose-style stack orchestrator for Apple container. macOS only."
homepage = "https://github.com/pulkitxm/ac"
documentation = "https://github.com/pulkitxm/ac/wiki"
readme = "README.md"
keywords = [
    "container",
    "macos",
    "docker",
    "compose",
    "cli",
]
categories = [
    "command-line-utilities",
    "development-tools",
    "virtualization",
]
license = "MIT"
repository = "https://github.com/pulkitxm/ac"

[[bin]]
name = "ac"
path = "src/main.rs"

[dependencies.anyhow]
version = "1"

[dependencies.clap]
version = "4"
features = [
    "derive",
    "env",
    "wrap_help",
]

[dependencies.clap_complete]
version = "4"
features = ["unstable-dynamic"]

[dependencies.ctrlc]
version = "3"

[dependencies.indicatif]
version = "0.17"

[dependencies.owo-colors]
version = "4"
features = ["supports-colors"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"
features = ["preserve_order"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
