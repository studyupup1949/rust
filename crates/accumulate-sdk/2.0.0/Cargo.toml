[package]
edition = "2021"
rust-version = "1.70"
name = "accumulate-sdk"
version = "2.0.0"
authors = ["OpenDLT Developers"]
build = false
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "examples/**",
]
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Accumulate Rust SDK (V2/V3 unified) with DevNet-first flows"
homepage = "https://github.com/opendlt/opendlt-rust-v2v3-sdk"
documentation = "https://docs.rs/accumulate-sdk"
readme = "README.md"
keywords = [
    "accumulate",
    "blockchain",
    "sdk",
    "json-rpc",
    "crypto",
]
categories = [
    "api-bindings",
    "cryptography",
    "network-programming",
]
license = "MIT"
repository = "https://github.com/opendlt/opendlt-rust-v2v3-sdk"

[features]
async-client = [
    "dep:reqwest",
    "reqwest/json",
    "reqwest/rustls-tls",
    "dep:tokio",
]
blocking-client = [
    "dep:reqwest",
    "reqwest/blocking",
    "reqwest/json",
    "reqwest/rustls-tls",
]
default = ["async-client"]
typescript-compat-tests = []

[lib]
name = "accumulate_client"
path = "src/lib.rs"

