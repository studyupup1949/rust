[package]
edition = "2021"
name = "ace-player"
version = "0.1.0"
authors = ["Purple Squirrel Media <matthew@purplesquirrelmedia.io>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "ACE Player — High-Performance Rust Media Engine SDK"
readme = "README.md"
license = "MIT"

[features]
default = ["native"]
drm = []
native = [
    "winit",
    "wgpu",
]
python-bindings = ["pyo3"]
wasm = [
    "wasm-bindgen",
    "web-sys",
    "js-sys",
]

[lib]
