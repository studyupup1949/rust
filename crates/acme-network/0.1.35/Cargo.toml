[package]
edition = "2021"
name = "acme-network"
version = "0.1.35"
authors = [
    "FL03 <jo3mccain@icloud.com>",
    "Joe McCain III <jo3mccain@scattered-systems.com>",
]
description = "acme-network is a featured package of acme, designed around libp2p and tokio in support of SCSYS."
