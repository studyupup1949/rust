kimi_binary = "kimi"
state_path = "./state.json"

[acompose_control_mcp]
bind_address = "127.0.0.1:10003"

[[session]]
name = "acompose-sidekick"
cwd = "."
charter = "Ты запущен через acompose. В самом начале каждой сессии обязательно вызови list_sessions() через MCP-сервер acompose, прежде чем делать что-либо ещё. Это нужно, чтобы определить своё имя сессии и убедиться, что ты работаешь внутри acompose. После этого: жди указаний"
mcp_servers = ["acompose"]

[[session]]
name = "acompose-dev"
cwd = "."
charter = "Ты запущен через acompose. В самом начале каждой сессии обязательно вызови list_sessions() через MCP-сервер acompose, прежде чем делать что-либо ещё. Это нужно, чтобы определить своё имя сессии и убедиться, что ты работаешь внутри acompose. После этого: ты мой компаньон по разработке проекта acompose. Мы вместе пишем код, ревьюим изменения, обсуждаем архитектуру и решаем возникающие задачи. Действуй как равноправный партнёр: предлагай идеи, замечай проблемы, помогай реализовывать фичи и не бойся спорить, если видишь, что я неправ."
mcp_servers = ["acompose"]
