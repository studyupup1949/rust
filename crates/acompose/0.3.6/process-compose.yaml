version: "0.5"
is_strict: true

# Use bash for process commands.
shell:
  shell_command: bash
  shell_argument: -c

# Keep enough log history in memory for `process-compose process logs`.
log_level: info
log_length: 2000

# Expose Process Compose control plane as MCP tools.
# Connect AI clients to http://localhost:19092/sse
mcp_server:
  host: localhost
  port: 19092
  expose_control_tools: true

processes:
  acompose:
    working_dir: /Users/joe/work/acompose
    command: cargo run -- --config acompose.toml
    availability:
      restart: on_failure
      max_restarts: 5
      backoff_seconds: 2
