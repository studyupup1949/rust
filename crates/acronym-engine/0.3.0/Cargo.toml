[package]
edition = "2024"
name = "acronym-engine"
version = "0.3.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Acronym Engine — real-time acronym expansion and definition extraction."
readme = "README.md"
license = "MIT"
repository = "https://github.com/dpep/ae"

[features]
default = ["ort-download"]
ort-download = [
    "ort/std",
    "ort/ndarray",
    "ort/tracing",
    "ort/download-binaries",
    "ort/tls-native",
    "ort/copy-dylibs",
    "ort/api-24",
]
ort-load-dynamic = [
    "ort/std",
    "ort/ndarray",
    "ort/tracing",
    "ort/load-dynamic",
    "ort/api-24",
]

[lib]
name = "acronym_engine"
path = "src/lib.rs"

[[bin]]
name = "ae"
path = "src/main.rs"

[[test]]
name = "cli_e2e"
path = "tests/cli_e2e.rs"

[[test]]
name = "daemon"
path = "tests/daemon.rs"

[[test]]
name = "embedding"
path = "tests/embedding.rs"

[dependencies.clap]
version = "4"
features = [
    "derive",
    "env",
]

[dependencies.env_logger]
version = "0.11"

[dependencies.fs2]
version = "0.4"

[dependencies.hf-hub]
version = "0.3"
features = ["online"]
default-features = false

[dependencies.log]
version = "0.4"

[dependencies.ort]
version = "=2.0.0-rc.12"
default-features = false

[dependencies.regex]
version = "1"

[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.tokenizers]
version = "0.23"
features = ["onig"]
default-features = false

[profile.release]
lto = true
codegen-units = 1
strip = true
