version: 2
project_name: acta
release:
  github:
    owner: Sn0wo2
    name: acta
  prerelease: auto
  name_template: v{{ .Version }}
builds:
  - id: acta-linux-amd64-v2
    targets:
      - x86_64-unknown-linux-gnu
    dir: .
    main: .
    binary: acta-debug
    builder: rust
    tool: ./scripts/cargo-or-zigbuild.py
    command: build
    flags:
      - --release
      - --all-features
      - --package=acta-debug
    env:
      - RUSTFLAGS=-C target-cpu=x86-64-v2
  - id: acta-linux-amd64-v3
    targets:
      - x86_64-unknown-linux-gnu
    dir: .
    main: .
    binary: acta-debug
    builder: rust
    tool: ./scripts/cargo-or-zigbuild.py
    command: build
    flags:
      - --release
      - --all-features
      - --package=acta-debug
    env:
      - RUSTFLAGS=-C target-cpu=x86-64-v3
  - id: acta-linux-arm64
    targets:
      - aarch64-unknown-linux-gnu
    dir: .
    main: .
    binary: acta-debug
    builder: rust
    tool: ./scripts/cargo-or-zigbuild.py
    command: build
    flags:
      - --release
      - --all-features
      - --package=acta-debug
  - id: acta-linux-armv7
    targets:
      - armv7-unknown-linux-gnueabihf
    dir: .
    main: .
    binary: acta-debug
    builder: rust
    tool: ./scripts/cargo-or-zigbuild.py
    command: build
    flags:
      - --release
      - --all-features
      - --package=acta-debug
  - id: acta-windows-amd64-v2
    targets:
      - x86_64-pc-windows-gnu
    dir: .
    main: .
    binary: acta-debug
    builder: rust
    tool: ./scripts/cargo-or-zigbuild.py
    command: build
    flags:
      - --release
      - --all-features
      - --package=acta-debug
    env:
      - RUSTFLAGS=-C target-cpu=x86-64-v2
  - id: acta-windows-amd64-v3
    targets:
      - x86_64-pc-windows-gnu
    dir: .
    main: .
    binary: acta-debug
    builder: rust
    tool: ./scripts/cargo-or-zigbuild.py
    command: build
    flags:
      - --release
      - --all-features
      - --package=acta-debug
    env:
      - RUSTFLAGS=-C target-cpu=x86-64-v3
archives:
  - id: linux-amd64-v2
    ids:
      - acta-linux-amd64-v2
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_{{ .Version }}_linux_amd64_v2'
    formats:
      - tar.gz
    files:
      - src: LICENSE
      - src: README.md
  - id: linux-amd64-v3
    ids:
      - acta-linux-amd64-v3
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_{{ .Version }}_linux_amd64_v3'
    formats:
      - tar.gz
    files:
      - src: LICENSE
      - src: README.md
  - id: linux-arm64
    ids:
      - acta-linux-arm64
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_{{ .Version }}_linux_arm64'
    formats:
      - tar.gz
    files:
      - src: LICENSE
      - src: README.md
  - id: linux-armv7
    ids:
      - acta-linux-armv7
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_{{ .Version }}_linux_armv7'
    formats:
      - tar.gz
    files:
      - src: LICENSE
      - src: README.md
  - id: windows-amd64-v2
    ids:
      - acta-windows-amd64-v2
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_{{ .Version }}_windows_amd64_v2'
    formats:
      - zip
    files:
      - src: LICENSE
      - src: README.md
  - id: windows-amd64-v3
    ids:
      - acta-windows-amd64-v3
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_{{ .Version }}_windows_amd64_v3'
    formats:
      - zip
    files:
      - src: LICENSE
      - src: README.md
srpm:
  nfpmrpm: {}
  package_name: acta
  file_name_template: '{{ .PackageName }}-{{ .Version }}.src.rpm'
  bins:
    acta: '%{goipath}'
snapshot:
  version_template: '{{ incpatch .Version }}-next'
checksum:
  name_template: checksums.txt
  algorithm: sha256
docker_digest:
  name_template: digests.txt
changelog:
  use: github
  format: '{{ .SHA }}: {{ .Message }} ({{ with .AuthorUsername }}@{{ . }}{{ else }}{{ .AuthorName }} <{{ .AuthorEmail }}>{{ end }})'
dist: dist
env_files:
  github_token: ~/.config/goreleaser/github_token
  gitlab_token: ~/.config/goreleaser/gitlab_token
  gitea_token: ~/.config/goreleaser/gitea_token
before:
  hooks:
    - rustup default stable
    - bash -c 'command -v cargo-zigbuild &>/dev/null || pip3 install cargo-zigbuild'
    - cargo fmt --all -- --check
    - cargo clippy --all-features -- -D warnings
    - cargo test --all
    - cargo test --all --all-features
    - cargo test --all --no-default-features
    - cargo publish --manifest-path crates/acta-build/Cargo.toml --dry-run --allow-dirty
    - cargo publish --dry-run --allow-dirty
source:
  name_template: '{{ .ProjectName }}-{{ .Version }}'
  format: tar.gz
gomod:
  gobinary: go
announce:
  twitter:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  mastodon:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    server: ""
  reddit:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    url_template: '{{ .ReleaseURL }}'
  slack:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: GoReleaser
  discord:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    author: GoReleaser
    color: "3888754"
    icon_url: https://goreleaser.com/static/avatar.png
  teams:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    color: '#2D313E'
    icon_url: https://goreleaser.com/static/avatar.png
  smtp:
    subject_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    body_template: 'You can view details from: {{ .ReleaseURL }}'
  mattermost:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    color: '#2D313E'
    username: GoReleaser
  linkedin:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  telegram:
    message_template: '{{ print .ProjectName " " .Tag " is out! Check it out at " .ReleaseURL | mdv2escape }}'
    parse_mode: MarkdownV2
  webhook:
    message_template: '{ "message": "{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}"}'
    content_type: application/json; charset=utf-8
    expected_status_codes:
      - 200
      - 201
      - 202
      - 204
  opencollective:
    title_template: '{{ .Tag }}'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out!<br/>Check it out at <a href="{{ .ReleaseURL }}">{{ .ReleaseURL }}</a>'
  bluesky:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  discourse:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: system
git:
  tag_sort: -version:refname
mcp:
  name: ""
  title: ""
  auth:
    type: none
retry:
  attempts: 10
  delay: 10s
  max_delay: 5m0s
github_urls:
  download: https://github.com
gitlab_urls:
  download: https://gitlab.com
