[package]
edition = "2024"
name = "acta"
version = "0.1.1"
build = "build.rs"
exclude = [
    ".github/",
    ".idea/",
    "img.png",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Make Tracing Great Again."
readme = "README.md"
keywords = [
    "tracing",
    "logging",
    "formatting",
    "colors",
    "theme",
]
categories = [
    "development-tools::debugging",
    "development-tools::profiling",
]
license = "Apache-2.0"
repository = "https://github.com/Sn0wo2/acta"

[features]
async = [
    "custom-async",
    "native-async",
]
compress = ["dep:flate2"]
custom-async = ["dep:tokio"]
default = [
    "unicode",
    "file",
]
file = ["dep:tracing-appender"]
native-async = ["file"]
nerd = ["dep:nerd-font-symbols"]
serde = ["dep:serde"]
unicode = []

[lib]
name = "acta"
path = "src/lib.rs"

[dependencies.arrayvec]
version = "0.7"

[dependencies.chrono]
version = "0.4"
features = ["clock"]
default-features = false

[dependencies.flate2]
version = "1.1.9"
features = ["miniz_oxide"]
optional = true
default-features = false

[dependencies.nerd-font-symbols]
version = "0.3.0"
optional = true

[dependencies.owo-colors]
version = "4.3.0"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.smallvec]
version = "1"

[dependencies.smart-default]
version = "0.7"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "io-std",
    "io-util",
    "rt",
    "sync",
]
optional = true
default-features = false

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-appender]
version = "0.2"
optional = true

[dependencies.tracing-log]
version = "0.2"

[dependencies.tracing-subscriber]
version = "0.3"
features = [
    "env-filter",
    "fmt",
    "json",
    "registry",
    "ansi",
    "std",
]

[build-dependencies.acta-build]
version = "0.1.1"

