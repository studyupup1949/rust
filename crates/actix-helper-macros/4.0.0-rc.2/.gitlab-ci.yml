stages:
  - test
  - deploy-actix-proc-macros
  - deploy-actix-helper-macros

variables:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: /sccache
  SCCACHE_ENDPOINT: 192.168.1.202:7480
  SCCACHE_S3_USE_SSL: "off"
  SCCACHE_BUCKET: gitlab-sccache

default:
  before_script:
    - mkdir /sccache-dl
    - |
      curl -Ls "$(curl -s https://api.github.com/repos/mozilla/sccache/releases/latest | grep 'browser_download_url.*sccache-v.*x86_64.*musl.tar.gz"' | cut -d: -f2- | sed -e 's/^ "//' -e 's/"$//')" | tar -C /sccache-dl -zxvf -
    - mv -vf /sccache-dl/*/sccache /sccache
    - chmod 755 /sccache
    - rm -Rvf /sccache-dl
    - |
      if [ -d .cargo ]; then
        rm -Rvf /usr/local/cargo
        time mv -f .cargo /usr/local/cargo
      fi
  after_script:
    - time mv -f /usr/local/cargo .cargo
    - /sccache -s

Test actix-proc-macros:
  stage: test
  image: rustlang/rust:nightly
  cache:
    - key: cargo
      policy: pull
      paths:
        - .cargo
  script:
    - cd actix-proc-macros
    - cargo test

Test actix-helper-macros:
  stage: test
  image: rustlang/rust:nightly
  cache:
    - key: cargo
      paths:
        - .cargo
  script:
    - cargo test

Push actix-proc-macros:
  stage: deploy-actix-proc-macros
  image: rustlang/rust:nightly
  cache:
    - key: cargo
      policy: pull
      paths:
        - .cargo
  script:
    - sh -c 'cargo login "${CARGO_TOKEN}" && cd actix-proc-macros && cargo publish'
  only:
    - tags

Push actix-hepler-macros:
  stage: deploy-actix-helper-macros
  image: rustlang/rust:nightly
  cache:
    - key: cargo
      policy: pull
      paths:
        - .cargo
  script:
    - sh -c 'cargo login "${CARGO_TOKEN}" && cargo publish'
  only:
    - tags

