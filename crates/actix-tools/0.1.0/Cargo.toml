[package]
name = "actix-tools"
version = "0.1.0"
authors = ["Loggi Tecnologia LTDA <dev@loggi.com>", "Gabriela Surita <gabsurita@gmail.com>"]
description = "Provide Plug&Play components for Actix and Actix-web to build modular, 12-factor compliant apps."
license = "MIT"
[dependencies.actix]
version = "0.7"
optional = true

[dependencies.chrono]
version = "0.4"
features = ["serde"]
optional = true

[dependencies.config]
version = "0.8"
optional = true

[dependencies.diesel]
version = "1.3"
features = ["r2d2", "postgres"]
optional = true

[dependencies.env_logger]
version = "0.5"
optional = true

[dependencies.influx_db_client]
version = "0.3"
optional = true

[dependencies.log]
version = "0.4"

[dependencies.num_cpus]
version = "1.8"

[dependencies.r2d2]
version = "0.8"
optional = true

[dependencies.r2d2_redis]
version = "0.7"
optional = true

[dependencies.redis]
version = "0.8"
optional = true

[dependencies.rumqtt]
version = "0.10.1"
optional = true

[dependencies.sentry]
version = "0.6"
optional = true

[dependencies.serde]
version = "1.0"

[dependencies.serde_derive]
version = "1.0"

[dependencies.serde_json]
version = "1.0"

[dependencies.url]
version = "1.7"

[features]
default = ["json_logs", "sentry", "config"]
diesel_actors = ["actix", "r2d2", "diesel"]
influx_actors = ["actix", "influx_db_client"]
