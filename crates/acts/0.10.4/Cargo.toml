[package]
edition = "2021"
name = "acts"
version = "0.10.4"
authors = ["Yao <yaojianpin@sohu.com>"]
description = "a fast, tiny, extensiable workflow engine"
homepage = "https://docs.rs/acts"
readme = "README.md"
keywords = ["workflow"]
license = "Apache-2.0"
repository = "https://github.com/yaojianpin/acts.git"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "workflow"
harness = false

[dependencies.async-trait]
version = "0.1.80"

[dependencies.chrono]
version = "0.4.38"

[dependencies.criterion]
version = "0.4.0"

[dependencies.duckdb]
