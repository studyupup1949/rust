    "bundled",
    "r2d2",
]
optional = true

[dependencies.futures]
version = "0.3.30"

[dependencies.globset]
version = "0.4.14"

[dependencies.hex]
version = "0.4.3"
features = ["serde"]

[dependencies.moka]
version = "0.12.7"
features = ["sync"]

[dependencies.nanoid]
version = "0.4.0"

[dependencies.once_cell]
version = "1.19.0"

[dependencies.r2d2]
version = "0.8.10"
optional = true

[dependencies.regex]
version = "1.10.4"

[dependencies.rquickjs]
version = "0.5.1"
features = [
    "full",
    "parallel",
]

[dependencies.serde]
version = "1.0.202"
