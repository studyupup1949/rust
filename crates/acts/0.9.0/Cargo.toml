[package]
edition = "2021"
name = "acts"
version = "0.9.0"
authors = ["Yao <yaojianpin@sohu.com>"]
description = "a fast, tiny, extensiable workflow engine"
readme = "README.md"
keywords = ["workflow"]
license = "Apache-2.0"
