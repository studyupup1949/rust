syntax = "proto3";

package ada.v1;

import "google/protobuf/struct.proto";

import "google/protobuf/timestamp.proto";

option go_package = "github.com/eleven-am/ada-sdk/go/gen/ada/v1;adav1";

message ActionItem {
  string id = 1;

  string owner_id = 3;

  string title = 4;

  string description = 5;

  string status = 6;

  int32 priority = 7;

  google.protobuf.Timestamp due_date = 8;

  google.protobuf.Timestamp completed_at = 9;

  repeated string blocked_by = 10;

  string meeting_id = 11;

  double confidence = 12;

  string source_id = 13;

  string source_type = 14;

  string source_chunk_id = 15;

  google.protobuf.Timestamp created_at = 16;

  google.protobuf.Timestamp updated_at = 17;

  double relevance_score = 18;
}

message Alternative {
  string description = 1;

  repeated string pros = 2;

  repeated string cons = 3;
}

message Atom {
  string id = 1;

  string subject = 2;

  string predicate = 3;

  string object = 4;

  double confidence = 5;

  string cardinality = 6;

  string claim_status = 7;

  string claim_type = 8;

  Temporal temporal = 9;

  string source_chunk_id = 10;

  string source_id = 11;

  string source_type = 12;

  int32 source_count = 13;

  double relevance_score = 14;
}

message BehaviorPattern {
  string id = 1;

  string subject_id = 2;

  string subject_name = 3;

  string pattern_type = 4;

  string metric = 5;

  double value = 6;

  string severity = 7;

  string description = 8;

  double confidence = 9;

  int32 sample_size = 10;

  google.protobuf.Timestamp detected_at = 11;

  google.protobuf.Timestamp created_at = 12;

  double relevance_score = 13;
}

message Chunk {
  string id = 1;

  int32 index = 2;

  string content = 3;

  int32 token_count = 4;
}

message Commitment {
  string id = 1;

  string maker_id = 3;

  string receiver_id = 4;

  string description = 5;

  string status = 6;

  google.protobuf.Timestamp due_date = 7;

  google.protobuf.Timestamp fulfilled_at = 8;

  double confidence = 9;

  string source_id = 10;

  string source_type = 11;

  string source_chunk_id = 12;

  google.protobuf.Timestamp created_at = 13;

  google.protobuf.Timestamp updated_at = 14;

  double relevance_score = 15;
}

message Community {
  string id = 1;

  int32 level = 3;

  repeated string entity_ids = 4;

  double score = 5;

  double modularity = 6;

  string summary = 7;

  google.protobuf.Timestamp created_at = 8;

  google.protobuf.Timestamp updated_at = 9;

  double relevance_score = 10;

  string resolution = 11;

  string status = 12;

  double cohesion_score = 13;

  int32 primary_member_count = 14;

  int32 total_member_count = 15;

  int32 graph_version = 16;

  bool summary_stale = 17;

  bool embedding_stale = 18;

  google.protobuf.Timestamp last_structural_change_at = 19;

  google.protobuf.Timestamp last_computed_at = 20;

  google.protobuf.Timestamp stabilized_at = 21;

  string superseded_by = 22;

  string summary_id = 23;
}

message Contradiction {
  string id = 1;

  string fact_a = 2;

  string fact_b = 3;

  string winner_id = 4;

  string loser_id = 5;

  string subject = 6;

  string predicate = 7;

  string type = 8;

  string classification = 9;

  string status = 10;

  double confidence = 11;

  string rationale = 12;

  google.protobuf.Timestamp resolved_at = 13;

  string resolved_by = 14;

  google.protobuf.Timestamp detected_at = 15;

  google.protobuf.Timestamp created_at = 16;

  double relevance_score = 17;
}

message Decision {
  string id = 1;

  string decider_id = 3;

  string description = 4;

  string rationale = 5;

  string status = 6;

  repeated Alternative alternatives = 7;

  repeated string dissent = 8;

  google.protobuf.Timestamp decided_at = 9;

  string superseded_by = 10;

  double confidence = 11;

  string source_id = 12;

  string source_type = 13;

  string source_chunk_id = 14;

  google.protobuf.Timestamp created_at = 15;

  google.protobuf.Timestamp updated_at = 16;

  double relevance_score = 17;
}

message Entity {
  string id = 1;

  string name = 2;

  string type = 3;

  repeated string aliases = 4;

  string description = 5;

  google.protobuf.Struct properties = 6;

  double confidence = 7;

  string community_id = 8;

  double relevance_score = 9;
}

message Event {
  string id = 1;

  string action = 3;

  repeated string participants = 4;

  google.protobuf.Timestamp occurred_at = 5;

  double confidence = 6;

  string source_id = 7;

  string source_type = 8;

  string source_chunk_id = 9;

  google.protobuf.Timestamp created_at = 10;

  google.protobuf.Timestamp updated_at = 11;

  double relevance_score = 12;
}

message Intention {
  string id = 1;

  string owner_id = 3;

  string description = 4;

  string action = 5;

  string trigger_type = 6;

  string trigger_value = 7;

  string status = 8;

  google.protobuf.Timestamp triggered_at = 9;

  google.protobuf.Timestamp expires_at = 10;

  double confidence = 11;

  string source_id = 12;

  string source_type = 13;

  string source_chunk_id = 14;

  google.protobuf.Timestamp created_at = 15;

  google.protobuf.Timestamp updated_at = 16;

  double relevance_score = 17;
}

message Interaction {
  string id = 1;

  string entity_a_id = 2;

  string entity_b_id = 3;

  string type = 4;

  string source_id = 5;

  google.protobuf.Timestamp occurred_at = 6;

  double strength = 7;

  string context = 8;

  google.protobuf.Timestamp created_at = 9;

  double relevance_score = 10;
}

message Meeting {
  string id = 1;

  string title = 3;

  string series_id = 4;

  repeated string agenda = 5;

  repeated string outcomes = 6;

  repeated string attendee_ids = 7;

  google.protobuf.Timestamp occurred_at = 8;

  int64 duration_ms = 9;

  double confidence = 10;

  string source_id = 11;

  string source_type = 12;

  string source_chunk_id = 13;

  google.protobuf.Timestamp created_at = 14;

  google.protobuf.Timestamp updated_at = 15;

  double relevance_score = 16;
}

message Observation {
  string id = 1;

  string observer_id = 3;

  string observed_id = 4;

  string type = 5;

  string description = 6;

  optional double sentiment = 7;

  google.protobuf.Timestamp observed_at = 8;

  double confidence = 9;

  string source_id = 10;

  string source_type = 11;

  string source_chunk_id = 12;

  google.protobuf.Timestamp created_at = 13;

  google.protobuf.Timestamp updated_at = 14;

  double relevance_score = 15;
}

message Path {
  repeated string nodes = 1;

  repeated string edges = 2;

  repeated string node_texts = 3;

  repeated string edge_texts = 4;

  double score = 5;

  double flow_score = 6;

  double keyword_score = 7;

  string narrative = 8;
}

message Priority {
  string id = 1;

  string stakeholder_id = 3;

  string description = 4;

  int32 rank = 5;

  string rationale = 6;

  google.protobuf.Timestamp valid_from = 7;

  google.protobuf.Timestamp valid_until = 8;

  double confidence = 9;

  string source_id = 10;

  string source_type = 11;

  string source_chunk_id = 12;

  google.protobuf.Timestamp created_at = 13;

  google.protobuf.Timestamp updated_at = 14;

  double relevance_score = 15;
}

message Provenance {
  string chunk_id = 1;

  string document_id = 2;

  string content = 3;

  int32 index = 4;
}

message Relation {
  string id = 1;

  string source_id = 2;

  string target_id = 3;

  string predicate = 4;

  repeated string descriptions = 5;

  repeated string keywords = 6;

  double weight = 7;

  double confidence = 8;

  string cardinality = 9;

  Temporal temporal = 10;

  int32 duplicate_count = 11;

  double relevance_score = 12;
}

message Summary {
  string id = 1;

  string type = 3;

  string target_id = 4;

  string content = 5;

  int32 token_count = 6;

  int32 source_count = 7;

  int32 level = 8;

  google.protobuf.Timestamp created_at = 9;

  google.protobuf.Timestamp updated_at = 10;

  double relevance_score = 11;

  string community_id = 12;

  string resolution = 13;

  int32 community_version = 14;

  bool stale = 15;

  google.protobuf.Timestamp generated_at = 16;
}

message Temporal {
  google.protobuf.Timestamp valid_from = 1;

  google.protobuf.Timestamp valid_to = 2;
}

message TemporalQuad {
  string id = 1;

  string subject = 3;

  string predicate = 4;

  string object = 5;

  google.protobuf.Timestamp valid_from = 6;

  google.protobuf.Timestamp valid_to = 7;

  double confidence = 8;

  string source_id = 9;

  google.protobuf.Timestamp created_at = 10;

  google.protobuf.Timestamp updated_at = 11;

  double relevance_score = 12;
}

message TimeReport {
  string id = 1;

  string time_graph_id = 3;

  string content = 4;

  int32 token_count = 5;

  google.protobuf.Timestamp generated_at = 6;

  double relevance_score = 7;
}
