syntax = "proto3";

package ada.v1;

import "ada/v1/events.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eleven-am/ada-sdk/go/gen/ada/v1;adav1";

enum SignalType {
  SIGNAL_TYPE_UNSPECIFIED = 0;
  SIGNAL_TYPE_MEMORY_COMMITMENT_DUE_SOON = 1;
  SIGNAL_TYPE_MEMORY_ACTION_ITEM_DUE_SOON = 2;
  SIGNAL_TYPE_MEMORY_COMMITMENT_BROKEN = 3;
  SIGNAL_TYPE_MEMORY_ACTION_ITEM_OVERDUE = 4;
  SIGNAL_TYPE_MEMORY_INTENTION_TRIGGERED = 5;
  SIGNAL_TYPE_MEMORY_INTENTION_EXPIRING_SOON = 6;
  SIGNAL_TYPE_MEMORY_INTENTION_EXPIRED = 7;
  SIGNAL_TYPE_MEMORY_CONTRADICTION_CREATED = 8;
  SIGNAL_TYPE_MEMORY_CONTRADICTION_ESCALATED = 9;
  SIGNAL_TYPE_TENSION_EMERGED = 10;
  SIGNAL_TYPE_TENSION_ESCALATED = 11;
  SIGNAL_TYPE_TRAJECTORY_DETERIORATED = 12;
  SIGNAL_TYPE_ROUTINE_BROKEN = 13;
}

enum SignalSeverity {
  SIGNAL_SEVERITY_UNSPECIFIED = 0;
  SIGNAL_SEVERITY_INFORMATIONAL = 1;
  SIGNAL_SEVERITY_IMPORTANT = 2;
  SIGNAL_SEVERITY_URGENT = 3;
}

enum SignalRefType {
  SIGNAL_REF_TYPE_UNSPECIFIED = 0;
  SIGNAL_REF_TYPE_ENTITY = 1;
  SIGNAL_REF_TYPE_COMMITMENT = 2;
  SIGNAL_REF_TYPE_ACTION_ITEM = 3;
  SIGNAL_REF_TYPE_INTENTION = 4;
  SIGNAL_REF_TYPE_CONTRADICTION = 5;
  SIGNAL_REF_TYPE_KNOWLEDGE = 6;
  SIGNAL_REF_TYPE_TENSION = 7;
  SIGNAL_REF_TYPE_TRAJECTORY = 8;
  SIGNAL_REF_TYPE_ROUTINE = 9;
  SIGNAL_REF_TYPE_COMMUNITY = 10;
  SIGNAL_REF_TYPE_DOCUMENT = 11;
}

message SignalRef {
  SignalRefType type = 1;
  string id = 2;
  string label = 3;
}

message SourceMessageRef {
  string id = 1;
}

message DueSignalAttributes {
  google.protobuf.Timestamp due_at = 1;
  string timezone = 2;
  string due_bucket = 3;
  int64 due_window_seconds = 4;
  int64 due_in_seconds = 5;
  int64 remaining_seconds = 6;
  int64 reminder_offset_seconds = 7;
  string record_kind = 8;
  string reminder_source = 9;
  string source_id = 10;
  string source_chunk_id = 11;
  SourceMessageRef message = 12;
  string status = 13;
  int64 version = 14;
  string maker_id = 15;
  string receiver_id = 16;
  string owner_id = 17;
}

message IntentionSignalAttributes {
  google.protobuf.Timestamp expires_at = 1;
  string timezone = 2;
  string reminder_source = 3;
  string owner_id = 4;
  string status = 5;
  int64 version = 6;
  string source_id = 7;
  string source_chunk_id = 8;
  string due_bucket = 9;
  int64 due_window_seconds = 10;
  int64 due_in_seconds = 11;
  int64 remaining_seconds = 12;
  int64 reminder_offset_seconds = 13;
}

message SignalEvidence {
  string text = 1;
  string source_id = 2;
}

message ContradictionSignalAttributes {
  string title = 1;
  string body = 2;
  string recurrence_key = 3;
  int64 recurrence_count = 4;
  int64 suppressed_count = 5;
  google.protobuf.Timestamp first_seen_at = 6;
  google.protobuf.Timestamp last_seen_at = 7;
  string subject_label = 8;
  string reason = 9;
  repeated SignalEvidence evidence = 10;
  string kind = 11;
  string classification = 12;
  string subject = 13;
  string predicate = 14;
  string winner_id = 15;
  string loser_id = 16;
  google.protobuf.Timestamp detected_at = 17;
  string status = 18;
  int64 version = 19;
}

message TensionSignalAttributes {
  string title = 1;
  string body = 2;
  string recurrence_key = 3;
  int64 recurrence_count = 4;
  int64 suppressed_count = 5;
  google.protobuf.Timestamp first_seen_at = 6;
  google.protobuf.Timestamp last_seen_at = 7;
  string subject_label = 8;
  string reason = 9;
  string subject_type = 10;
  string subject_id = 11;
  string theme = 12;
  string severity = 13;
  string previous_severity = 14;
  string status = 15;
  int64 occurrence_count = 16;
  int64 unresolved_count = 17;
  google.protobuf.Timestamp detected_at = 18;
  int64 version = 19;
}

message TrajectorySignalAttributes {
  string subject_type = 1;
  string subject_id = 2;
  string metric = 3;
  string direction = 4;
  string status = 5;
  double change_ratio = 6;
  google.protobuf.Timestamp window_start = 7;
  google.protobuf.Timestamp window_end = 8;
  int64 version = 9;
}

message RoutineSignalAttributes {
  string subject_type = 1;
  string subject_id = 2;
  string routine_key = 3;
  string status = 4;
  int64 occurrence_count = 5;
  google.protobuf.Timestamp last_observed_at = 6;
  int64 version = 7;
}

message MemoryCommitmentDueSoon {
  DueSignalAttributes attributes = 1;
}

message MemoryActionItemDueSoon {
  DueSignalAttributes attributes = 1;
}

message MemoryCommitmentBroken {
  DueSignalAttributes attributes = 1;
}

message MemoryActionItemOverdue {
  DueSignalAttributes attributes = 1;
}

message MemoryIntentionTriggered {
  IntentionSignalAttributes attributes = 1;
}

message MemoryIntentionExpiringSoon {
  IntentionSignalAttributes attributes = 1;
}

message MemoryIntentionExpired {
  IntentionSignalAttributes attributes = 1;
}

message MemoryContradictionCreated {
  ContradictionSignalAttributes attributes = 1;
}

message MemoryContradictionEscalated {
  ContradictionSignalAttributes attributes = 1;
}

message TensionEmerged {
  TensionSignalAttributes attributes = 1;
}

message TensionEscalated {
  TensionSignalAttributes attributes = 1;
}

message TrajectoryDeteriorated {
  TrajectorySignalAttributes attributes = 1;
}

message RoutineBroken {
  RoutineSignalAttributes attributes = 1;
}

message SignalEvent {
  string id = 1;
  int32 spec_version = 2;
  google.protobuf.Timestamp occurred_at = 4;
  string principal_id = 5;
  SignalRef subject = 6;
  string summary = 7;
  SignalSeverity severity = 8;
  repeated SignalRef refs = 10;
  string dedupe_key = 11;

  oneof signal {
    MemoryCommitmentDueSoon memory_commitment_due_soon = 20;
    MemoryActionItemDueSoon memory_action_item_due_soon = 21;
    MemoryCommitmentBroken memory_commitment_broken = 22;
    MemoryActionItemOverdue memory_action_item_overdue = 23;
    MemoryIntentionTriggered memory_intention_triggered = 24;
    MemoryIntentionExpiringSoon memory_intention_expiring_soon = 25;
    MemoryIntentionExpired memory_intention_expired = 26;
    MemoryContradictionCreated memory_contradiction_created = 27;
    MemoryContradictionEscalated memory_contradiction_escalated = 28;
    TensionEmerged tension_emerged = 29;
    TensionEscalated tension_escalated = 30;
    TrajectoryDeteriorated trajectory_deteriorated = 31;
    RoutineBroken routine_broken = 32;
  }

  reserved 3, 9;
  reserved "type", "attributes";
}

message SignalStreamEvent {
  string cursor = 1;
  SignalEvent signal = 2;
}

message StreamSignalsRequest {
  repeated SignalType event_types = 1;
  string after_event_id = 2;
  int32 replay_limit = 3;
  string principal_id = 100;
  StreamScopeMode scope_mode = 101;
}

message GetSignalCatalogRequest {}

message GetSignalCatalogResponse {
  repeated SignalType event_types = 1;
}

service SignalService {
  rpc StreamSignals(StreamSignalsRequest) returns (stream SignalStreamEvent);
  rpc GetSignalCatalog(GetSignalCatalogRequest) returns (GetSignalCatalogResponse);
}
