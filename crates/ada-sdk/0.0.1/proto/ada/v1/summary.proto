syntax = "proto3";

package ada.v1;

import "ada/v1/common.proto";
import "ada/v1/data.proto";
import "ada/v1/ingest.proto";
import "ada/v1/query.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/eleven-am/ada-sdk/go/gen/ada/v1;adav1";

message GetSummaryOverviewRequest {
  int32 lookback_days = 1;
  string principal_id = 100;
}

message SummaryOverview {
  int32 principals = 3;
  int32 anomalies = 4;
  int32 contradictions = 5;
  int32 stale_banks = 6;
  double ingest_success = 7;
}

message GetSummaryOverviewResponse {
  SummaryOverview overview = 1;
  bool degraded = 90;
  repeated string degradation_reasons = 91;
}

message ListSummaryPrincipalsRequest {
  PaginationRequest pagination = 1;
  string status = 2;
  int32 lookback_days = 3;
  string principal_id = 100;
}

message ListSummaryActivityRequest {
  PaginationRequest pagination = 1;
  int32 lookback_days = 2;
  repeated string kinds = 3;
  reserved 4;
  string principal_id = 100;
}

message SummaryActivityItem {
  string id = 1;
  string kind = 2;
  string resource_id = 3;
  string resource_type = 4;
  string principal_id = 5;
  string principal_name = 6;
  string title = 7;
  string summary = 8;
  string status = 9;
  google.protobuf.Timestamp occurred_at = 10;
}

message ListSummaryActivityResponse {
  repeated SummaryActivityItem items = 1;
  PaginationMeta pagination = 2;
  bool degraded = 90;
  repeated string degradation_reasons = 91;
}

message PrincipalSummary {
  string principal_id = 1;
  string name = 2;
  double health_score = 3;
  repeated string signals = 4;
  int32 items_count = 5;
  int32 contradictions_count = 6;
  google.protobuf.Timestamp last_active_at = 7;
  string status = 8;
  int32 entities_count = 9;
  repeated AttentionSignal signal_details = 11;

  reserved 10;
}

message ListSummaryPrincipalsResponse {
  repeated PrincipalSummary principals = 1;
  PaginationMeta pagination = 2;
  bool degraded = 90;
  repeated string degradation_reasons = 91;
}

message GetPrincipalOverviewRequest {
  string principal_id = 1;
  int32 lookback_days = 2;
}

message PrincipalOverview {
  string principal_id = 1;
  string name = 2;
  int32 entities_count = 4;
  int32 items_count = 5;
  double health_score = 6;
  string status = 7;
  repeated string signals = 8;
  google.protobuf.Timestamp last_active_at = 9;
  int32 contradictions_count = 10;
  repeated AttentionSignal signal_details = 11;

  reserved 3;
}

message GetPrincipalOverviewResponse {
  bool found = 1;
  PrincipalOverview overview = 2;
  bool degraded = 90;
  repeated string degradation_reasons = 91;
}

message GetPrincipalKnowledgeSummaryRequest {
  string principal_id = 1;
  int32 lookback_days = 2;
  int32 top_k = 3;
}

message PrincipalKnowledgeSummary {
  string principal_id = 1;
  int32 entities_count = 2;
  int32 observations_count = 3;
  int32 relations_count = 4;
  int32 events_count = 5;
  int32 meetings_count = 6;
  int32 contradictions_count = 7;
  int32 communities_count = 8;
  int32 patterns_count = 9;
  repeated BehaviorPattern patterns = 10;
}

message GetPrincipalKnowledgeSummaryResponse {
  bool found = 1;
  PrincipalKnowledgeSummary summary = 2;
  bool degraded = 90;
  repeated string degradation_reasons = 91;
}

message GetPrincipalSourcesSummaryRequest {
  string principal_id = 1;
  int32 lookback_days = 2;
  int32 top_k = 3;
}

message PrincipalSourcesSummary {
  string principal_id = 1;
  int32 documents_count = 2;
  int32 ingest_jobs_count = 3;
  int32 completed_jobs_count = 4;
  int32 failed_jobs_count = 5;
  google.protobuf.Timestamp last_document_at = 6;
  google.protobuf.Timestamp last_ingest_at = 7;
  repeated DocumentRecord recent_documents = 8;
  repeated JobStatus recent_jobs = 9;
  bool has_latest_accounting = 10;
  IngestAccounting latest_accounting = 11;
}

message GetPrincipalSourcesSummaryResponse {
  bool found = 1;
  PrincipalSourcesSummary summary = 2;
  bool degraded = 90;
  repeated string degradation_reasons = 91;
}

message AttentionSignal {
  string code = 1;
  string summary = 2;
  string severity = 3;
}

message GetPrincipalNowRequest {
  string principal_id = 1;
  int32 lookback_days = 2;
  int32 top_k = 3;
}

message PrincipalNow {
  string principal_id = 1;
  repeated AttentionSignal attention_now = 2;
  repeated DecisionRecord active_decisions = 3;
  repeated Priority priorities = 4;
  repeated Actor who_matters = 5;
  repeated KnowledgeItem recent_changes = 6;
}

message GetPrincipalNowResponse {
  bool found = 1;
  PrincipalNow now = 2;
  bool degraded = 90;
  repeated string degradation_reasons = 91;
}

service SummaryService {
  rpc GetSummaryOverview(GetSummaryOverviewRequest) returns (GetSummaryOverviewResponse);
  rpc ListSummaryPrincipals(ListSummaryPrincipalsRequest) returns (ListSummaryPrincipalsResponse);
  rpc ListSummaryActivity(ListSummaryActivityRequest) returns (ListSummaryActivityResponse);
  rpc GetPrincipalOverview(GetPrincipalOverviewRequest) returns (GetPrincipalOverviewResponse);
  rpc GetPrincipalKnowledgeSummary(GetPrincipalKnowledgeSummaryRequest) returns (GetPrincipalKnowledgeSummaryResponse);
  rpc GetPrincipalSourcesSummary(GetPrincipalSourcesSummaryRequest) returns (GetPrincipalSourcesSummaryResponse);
  rpc GetPrincipalNow(GetPrincipalNowRequest) returns (GetPrincipalNowResponse);
}
