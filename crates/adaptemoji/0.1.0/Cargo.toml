[package]
edition = "2021"
rust-version = "1.74"
name = "adaptemoji"
version = "0.1.0"
authors = ["Aleksei Rybin <0xalekseirybin@gmail.com>"]
exclude = [
    "assets/*",
    ".github/*",
    "examples/*",
]
description = "Convert your regular Telegram emojis into adaptive monochrome versions"
homepage = "https://github.com/adaptemoji/adaptemoji"
documentation = "https://docs.rs/adaptemoji"
readme = "README.md"
keywords = [
    "image",
    "telegram",
    "emoji",
    "terminal",
    "cli",
]
categories = [
    "command-line-utilities",
    "multimedia",
    "multimedia::images",
    "multimedia::video",
    "visualization",
]
license = "MIT"
repository = "https://github.com/adaptemoji/adaptemoji"

[[bin]]
name = "adaptemoji"
required-features = ["cli"]

[dependencies.clap]
version = "4.5"
features = ["derive"]
optional = true

[dependencies.image]
version = "0.25"
features = ["default-formats"]
default_features = false

[features]
cli = ["dep:clap"]
default = ["full"]
full = [
    "rayon",
    "cli",
]
rayon = ["image/rayon"]
