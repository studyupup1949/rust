[dependencies.libc]
version = "0.2"
optional = true

[dependencies.log]
version = "0.4"

[dependencies.regex]
version = "1"

[dependencies.reqwest]
version = "0.12"
features = [
    "rustls-tls",
    "stream",
]
optional = true
default-features = false

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
