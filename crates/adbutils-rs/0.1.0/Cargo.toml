[package]
edition = "2021"
rust-version = "1.80"
name = "adbutils-rs"
version = "0.1.0"
authors = ["fllaa <fallahandyprakasa26@gmail.com>"]
build = "build.rs"
exclude = [
    "assets/binaries/*",
    "/.github",
    "/target",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async Rust client for the Android Debug Bridge (adb) server smartsocket protocol. Port of adbutils-python."
homepage = "https://github.com/fllaa/adbutils-rs"
documentation = "https://docs.rs/adbutils-rs"
readme = "README.md"
keywords = [
    "adb",
    "android",
    "automation",
    "uiautomator",
    "async",
]
categories = [
    "api-bindings",
    "development-tools",
    "asynchronous",
]
license = "MIT"
repository = "https://github.com/fllaa/adbutils-rs"

[features]
apk = [
    "dep:reqwest",
    "dep:zip",
]
cli = ["dep:clap"]
default = [
    "image",
    "apk",
    "screenrecord",
    "cli",
]
e2e = []
image = ["dep:image"]
screenrecord = ["dep:libc"]

[lib]
name = "adbutils"
path = "src/lib.rs"

[[bin]]
name = "adbutils"
path = "src/bin/adbutils.rs"
