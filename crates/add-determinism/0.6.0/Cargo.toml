readme = "README.md"
keywords = [
    "rpm",
    "reproducible-builds",
]
license = "GPL-3.0-or-later"
repository = "https://github.com/keszybz/add-determinism"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[lib]
name = "add_determinism"
