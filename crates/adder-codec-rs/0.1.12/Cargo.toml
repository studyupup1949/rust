[package]
edition = "2021"
name = "adder-codec-rs"
version = "0.1.12"
authors = ["Andrew C. Freeman"]
exclude = ["tests/samples/*"]
default-run = "events_to_instantaneous_frames"
description = """
Encoder/transcoder/decoder for ADΔER (Address, Decimation, Δt Event Representation) streams.
 Currently, only implemented for raw (uncompressed) streams. Includes a transcoder for casting framed video
 into an ADΔER representation in a manner which preserves the temporal synchronicity of the source, but enables
 many-frame intensity averaging on a per-pixel basis, and high dynamic range.
 """
homepage = "https://github.com/ac-freeman/adder-codec-rs"
readme = "README.md"
keywords = [
    "neuromorphic",
    "decoding",
    "event",
    "asynchronous",
    "video",
]
categories = [
    "multimedia::encoding",
    "science",
]
license-file = "LICENSE"
repository = "https://github.com/ac-freeman/adder-codec-rs"
resolver = "2"

[package.metadata.docs.rs]
no-default-features = true
default-target = "x86_64-unknown-linux-gnu"
features = ["docs-only"]

[profile.dev]
opt-level = 0

[profile.release]
lto = true

[profile.test]
opt-level = 2

