[package]
edition = "2024"
rust-version = "1.96"
name = "adequate_booru_viewer"
version = "1.1.2"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
default-run = "abv"
description = "a somewhat-adequate booru reference viewer: fast local boolean-tag search, GPU water UI"
homepage = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/adequate_booru_viewer"
readme = "README.md"
keywords = [
    "booru",
    "danbooru",
    "egui",
    "wgpu",
    "viewer",
]
categories = [
    "gui",
    "multimedia::images",
]
license = "MIT"
repository = "https://github.com/aoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoaoa/adequate_booru_viewer"

[features]
devtools = [
    "dep:serde_json",
    "dwemer_poolrooms/instrumentation",
]
egui-test = [
    "dep:egui-tester-witness",
    "eternalist-apps/egui-test",
]

[lib]
name = "adequate_booru_viewer"
path = "src/lib.rs"

[[bin]]
name = "abv"
path = "src/main.rs"

[[example]]
