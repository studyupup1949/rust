<svg class="adic-clock" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
    background: white;
}
svg .clock-circle {
    fill: transparent;
    stroke: black;
    stroke-width: 0.2;
}
svg .clock-zero-val-circle {
    fill: transparent;
    stroke: red;
    stroke-width: 0.2;
}
svg .clock-val-circle {
    fill: transparent;
    stroke: black;
    stroke-width: 0.2;
    stroke-dasharray: 1, 4;
}
svg .clock-hand-path {
    fill: transparent;
    stroke: black;
    stroke-width: 0.2;
}
svg .clock-head-circle {
    fill: black;
    stroke: black;
    stroke-width: 0.2;
}
svg .tick-label {
    fill: black;
    text-anchor: middle;
    dominant-baseline: middle;
}
</style>
