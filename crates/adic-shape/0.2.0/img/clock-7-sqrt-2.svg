<style>
svg {
    background: white;
}
svg .clock-circle {
    fill: transparent;
    stroke: black;
    stroke-width: 0.2;
}
svg .clock-zero-val-circle {
    fill: transparent;
    stroke: red;
    stroke-width: 0.2;
}
svg .clock-val-circle {
    fill: transparent;
    stroke: black;
    stroke-width: 0.2;
    stroke-dasharray: 1, 4;
}
svg .clock-hand-path {
    fill: transparent;
    stroke: black;
    stroke-width: 0.2;
}
svg .clock-head-circle {
    fill: black;
    stroke: black;
    stroke-width: 0.2;
}
svg .tick-label {
    fill: black;
    text-anchor: middle;
    dominant-baseline: middle;
}
</style>
