[package]
edition = "2024"
rust-version = "1.85.0"
name = "adk-audio"
version = "0.8.0"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Audio intelligence and pipeline orchestration for ADK-Rust agents"
documentation = "https://docs.rs/adk-audio"
readme = "README.md"
keywords = [
    "adk",
    "audio",
    "tts",
    "stt",
    "speech",
]
categories = [
    "multimedia::audio",
    "asynchronous",
]
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/adk-rust"
resolver = "2"

[features]
all = [
    "tts",
    "stt",
    "music",
    "fx",
    "vad",
    "streaming",
    "mlx",
    "all-onnx",
    "livekit",
]
all-onnx = [
    "onnx",
    "kokoro",
    "chatterbox",
    "whisper-onnx",
    "distil-whisper",
    "moonshine",
    "qwen3-tts",
]
chatterbox = ["onnx"]
default = [
    "tts",
    "stt",
]
desktop-audio = [
    "dep:cpal",
    "vad",
]
distil-whisper = ["onnx"]
fx = [
    "dep:rubato",
    "dep:dasp",
]
kokoro = [
    "onnx",
    "dep:espeak-rs",
    "dep:ndarray",
    "dep:ndarray-npy",
]
livekit = [
    "dep:livekit-api",
    "dep:adk-realtime",
    "dep:base64",
]
mlx = [
    "dep:tokenizers",
    "dep:hf-hub",
]
moonshine = ["onnx"]
music = ["dep:reqwest"]
onnx = [
    "dep:ort",
    "dep:tokenizers",
    "dep:hf-hub",
]
qwen3-tts = [
    "dep:qwen_tts",
    "dep:hf-hub",
    "dep:candle-core",
]
streaming = []
stt = [
    "dep:reqwest",
    "dep:tokio-tungstenite",
]
tts = [
    "dep:reqwest",
    "dep:base64",
]
vad = ["dep:webrtc-vad"]
whisper-onnx = ["onnx"]

[lib]
