[package]
edition = "2024"
rust-version = "1.85.0"
name = "adk-cli"
version = "0.6.0"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Command-line launcher for Rust Agent Development Kit (ADK-Rust) agents"
documentation = "https://docs.rs/adk-cli"
readme = "README.md"
keywords = [
    "ai",
    "agent",
    "adk",
    "cli",
    "launcher",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/adk-rust"
resolver = "2"

[lib]
name = "adk_cli"
path = "src/lib.rs"

[[bin]]
name = "adk-rust"
path = "src/main.rs"

[dependencies.adk-agent]
version = "0.6.0"

[dependencies.adk-artifact]
version = "0.6.0"

[dependencies.adk-core]
version = "0.6.0"

[dependencies.adk-deploy]
version = "0.6.0"

[dependencies.adk-model]
version = "0.6.0"
features = ["all-providers"]

[dependencies.adk-runner]
version = "0.6.0"

[dependencies.adk-server]
version = "0.6.0"

[dependencies.adk-session]
version = "0.6.0"

[dependencies.adk-skill]
version = "0.6.0"

[dependencies.adk-telemetry]
version = "0.6.0"

[dependencies.adk-tool]
version = "0.6.0"

[dependencies.anyhow]
version = "1.0"

[dependencies.axum]
version = "0.8"

[dependencies.clap]
version = "4.6"
features = ["derive"]

[dependencies.dirs]
version = "6"

[dependencies.futures]
version = "0.3"

[dependencies.rustyline]
version = "18.0"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.tokio]
version = "1.40"
features = ["full"]
default-features = false

[dependencies.tokio-util]
version = "0.7"
features = ["rt"]

[dependencies.toml]
version = "0.8"

[dependencies.tracing]
version = "0.1"

[dev-dependencies.async-trait]
version = "0.1"

[dev-dependencies.tower]
version = "0.5"
features = ["util"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies.keyring]
version = "3.6.3"
features = [
    "sync-secret-service",
    "crypto-rust",
]
default-features = false

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.keyring]
version = "3.6.3"
features = ["apple-native"]
default-features = false

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3.6.3"
features = ["windows-native"]
default-features = false
