[package]
edition = "2021"
rust-version = "1.75"
name = "adk-model"
version = "0.1.3"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "LLM model integrations for ADK (Gemini, etc.)"
documentation = "https://docs.rs/adk-model"
readme = "README.md"
keywords = [
    "ai",
    "agent",
    "adk",
    "gemini",
    "llm",
]
categories = [
    "api-bindings",
    "asynchronous",
]
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/adk-rust"

[features]
