path = "tests/seatbelt_profile_property_tests.rs"

[dependencies.adk-core]
version = "0.8.3"

[dependencies.async-trait]
version = "0.1"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.tempfile]
version = "3.10"

[dependencies.thiserror]
version = "2.0"

[dependencies.tokio]
version = "1.40"
features = [
    "process",
    "time",
    "io-util",
]
default-features = false

[dependencies.tracing]
version = "0.1"

[dependencies.wasmtime]
version = "44"
optional = true

[dependencies.wasmtime-wasi]
version = "44"
