[package]
edition = "2024"
rust-version = "1.85.0"
name = "adk-sandbox"
version = "0.8.3"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Isolated code execution runtime for ADK agents"
homepage = "https://www.zavora.ai"
documentation = "https://docs.rs/adk-sandbox"
readme = "README.md"
keywords = [
    "adk",
    "sandbox",
    "code-execution",
    "wasm",
    "isolation",
]
categories = [
    "development-tools",
    "asynchronous",
]
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/adk-rust"
resolver = "2"

[features]
default = ["process"]
process = []
sandbox-linux = []
sandbox-macos = []
sandbox-native = [
    "sandbox-macos",
    "sandbox-linux",
    "sandbox-windows",
]
sandbox-windows = ["dep:windows-sys"]
wasm = [
    "dep:wasmtime",
    "dep:wasmtime-wasi",
]

[lib]
name = "adk_sandbox"
path = "src/lib.rs"

[[test]]
