[package]
edition = "2021"
rust-version = "1.75"
name = "adk-session"
version = "0.1.3"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Session management and state persistence for Rust Agent Development Kit (ADK-Rust) agents"
documentation = "https://docs.rs/adk-session"
readme = "README.md"
keywords = [
    "ai",
    "agent",
    "adk",
    "session",
    "state",
]
categories = [
    "api-bindings",
    "asynchronous",
]
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/adk-rust"

[features]
database = ["sqlx"]
default = []

[lib]
name = "adk_session"
path = "src/lib.rs"

[[example]]
name = "database_example"
path = "examples/database_example.rs"

[[example]]
name = "verify_database"
path = "examples/verify_database.rs"

[[test]]
name = "database_tests"
path = "tests/database_tests.rs"

[[test]]
name = "inmemory_tests"
path = "tests/inmemory_tests.rs"

[dependencies.adk-core]
version = "0.1.0"

[dependencies.async-trait]
version = "0.1"

[dependencies.chrono]
version = "0.4"
