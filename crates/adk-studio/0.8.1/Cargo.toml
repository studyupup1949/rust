[package]
edition = "2024"
rust-version = "1.85.0"
name = "adk-studio"
version = "0.8.1"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
build = "build.rs"
include = [
    "/src/**/*",
    "/build.rs",
    "/templates/**/*",
    "/ui/dist/**/*",
    "/README.md",
    "/LICENSE",
    "/docs/studio-screenshot.png",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Visual development environment for AI agents built with Rust Agent Development Kit (ADK-Rust)"
homepage = "https://www.zavora.ai"
readme = "README.md"
keywords = [
    "ai",
    "agents",
    "studio",
    "visual",
    "low-code",
]
categories = [
    "development-tools",
    "gui",
]
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/adk-studio"

[package.metadata.docs.rs]
rustc-args = [
    "--cfg",
    "docsrs",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[lib]
name = "adk_studio"
path = "src/lib.rs"

[[bin]]
name = "adk-studio"
path = "src/main.rs"

