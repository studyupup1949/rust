[package]
edition = "2024"
rust-version = "1.85.0"
name = "adk-tool"
version = "0.6.0"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Tool system for Rust Agent Development Kit (ADK-Rust) agents (FunctionTool, MCP, Google Search)"
documentation = "https://docs.rs/adk-tool"
readme = "README.md"
keywords = [
    "ai",
    "agent",
    "adk",
    "tools",
    "mcp",
]
categories = [
    "api-bindings",
    "asynchronous",
]
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/adk-rust"
resolver = "2"

[features]
code = [
    "dep:adk-code",
    "dep:adk-sandbox",
]
code-docker = [
    "code",
    "adk-code/docker",
]
code-embedded-js = [
    "code",
    "adk-code/embedded-js",
]
default = []
http-transport = [
    "rmcp/transport-streamable-http-client-reqwest",
    "reqwest",
]

[lib]
name = "adk_tool"
path = "src/lib.rs"

[[test]]
name = "builtin_tests"
path = "tests/builtin_tests.rs"

[[test]]
name = "code_execution_tests"
path = "tests/code_execution_tests.rs"

[[test]]
name = "function_tool_tests"
path = "tests/function_tool_tests.rs"

[[test]]
name = "toolset_tests"
path = "tests/toolset_tests.rs"

[dependencies.adk-code]
version = "0.6.0"
optional = true

[dependencies.adk-core]
version = "0.6.0"

[dependencies.adk-rust-macros]
version = "0.6.0"

[dependencies.adk-sandbox]
version = "0.6.0"
optional = true

[dependencies.adk-telemetry]
version = "0.6.0"

[dependencies.async-trait]
version = "0.1"

[dependencies.base64]
version = "0.22"

[dependencies.futures]
version = "0.3"

[dependencies.reqwest]
version = "0.12"
features = [
    "json",
    "stream",
    "rustls-tls-native-roots",
    "multipart",
]
optional = true

[dependencies.rmcp]
version = "1.3"
features = ["client"]

[dependencies.schemars]
version = "0.8"

[dependencies.serde]
version = "1.0"
