[package]
edition = "2024"
rust-version = "1.85.0"
name = "adk-ui"
version = "0.8.0"
authors = ["James Karanja Maina <james.karanja@zavora.ai>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Dynamic UI generation for ADK-Rust agents - render forms, cards, tables, charts and more"
documentation = "https://docs.rs/adk-ui"
readme = "README.md"
keywords = [
    "ai",
    "agent",
    "ui",
    "generative",
    "adk",
]
categories = [
    "api-bindings",
    "gui",
]
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/adk-ui"

[features]
adk-core = ["dep:adk-core"]
awp = [
    "dep:awp-types",
    "dep:uuid",
]
default = []
