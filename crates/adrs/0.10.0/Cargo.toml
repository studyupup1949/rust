[package]
edition = "2024"
rust-version = "1.90"
name = "adrs"
version = "0.10.0"
authors = ["josh rotenberg <joshrotenberg@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Command line tool for managing Architecture Decision Records"
homepage = "https://joshrotenberg.com/adrs/"
documentation = "https://joshrotenberg.com/adrs/"
readme = "README.md"
keywords = [
    "adr",
    "architecture",
    "decision-records",
    "madr",
    "cli",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/adrs"
resolver = "2"

[features]
default = ["mcp"]
mcp = [
    "dep:tower-mcp",
    "dep:schemars",
    "dep:tokio",
]
mcp-http = [
    "mcp",
    "tower-mcp/http",
]

[[bin]]
name = "adrs"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"

[dependencies.adrs-core]
version = "0.10.0"

[dependencies.anyhow]
version = "1"

[dependencies.clap]
version = "4"
features = [
    "derive",
    "env",
    "string",
]

[dependencies.clap_complete]
version = "4"

[dependencies.edit]
version = "0.1"

[dependencies.schemars]
version = "1"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.time]
version = "0.3"
features = [
    "local-offset",
    "formatting",
    "macros",
    "serde",
    "parsing",
]

[dependencies.tokio]
version = "1"
features = ["full"]
optional = true

[dependencies.tower-mcp]
version = "0.12"
features = ["http"]
optional = true

[dependencies.whoami]
version = "2"

[dev-dependencies.assert_cmd]
version = "2"

[dev-dependencies.assert_fs]
version = "1"

[dev-dependencies.predicates]
version = "3"

[dev-dependencies.serial_test]
version = "3.5"

[dev-dependencies.tempfile]
version = "3"
