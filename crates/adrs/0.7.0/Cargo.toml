[package]
edition = "2024"
name = "adrs"
version = "0.7.0"
authors = ["josh rotenberg <joshrotenberg@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Command line tool for managing Architecture Decision Records"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/adrs"
resolver = "2"

[features]
default = ["mcp"]
mcp = [
    "rmcp",
    "schemars",
    "tokio",
]
mcp-http = [
    "mcp",
    "tokio-util",
    "axum",
]

[[bin]]
name = "adrs"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"

[dependencies.adrs-core]
version = "0.7.0"

[dependencies.anyhow]
version = "1"

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.clap]
version = "4"
features = [
    "derive",
    "env",
    "string",
]

[dependencies.clap_complete]
version = "4"

[dependencies.edit]
version = "0.1"

[dependencies.rmcp]
version = "0.14"
features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
]
optional = true

[dependencies.schemars]
version = "1"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.time]
version = "0.3"
features = [
    "local-offset",
    "formatting",
    "macros",
    "serde",
    "parsing",
]

[dependencies.tokio]
version = "1"
