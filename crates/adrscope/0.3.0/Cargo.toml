[package]
edition = "2024"
rust-version = "1.85"
name = "adrscope"
version = "0.3.0"
authors = ["Robert Allen <zircote@gmail.com>"]
build = false
include = [
    "src/**",
    "templates/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A lightweight, zero-dependency visualization tool for Architecture Decision Records"
homepage = "https://github.com/zircote/adrscope"
documentation = "https://docs.rs/adrscope"
readme = "README.md"
keywords = [
    "adr",
    "architecture",
    "documentation",
    "cli",
    "madr",
]
categories = [
    "command-line-utilities",
    "development-tools",
]
license = "MIT"
repository = "https://github.com/zircote/adrscope"

[features]
default = []
testing = []

[lib]
name = "adrscope"
path = "src/lib.rs"

[[bin]]
name = "adrscope"
path = "src/main.rs"

[dependencies.askama]
version = "0.14"

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.glob]
version = "0.3"

[dependencies.pulldown-cmark]
version = "0.13"
features = ["html"]
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.serde_yaml]
version = "0.9"

[dependencies.thiserror]
version = "2"

[dependencies.time]
