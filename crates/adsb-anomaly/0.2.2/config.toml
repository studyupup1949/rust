# ADS-B Anomaly Detection System Configuration
# Copy this file to config.toml and customize as needed

[adsb]
# URL to PiAware/dump1090-fa aircraft.json endpoint
piaware_url = "http://192.168.200.142:8080/data/aircraft.json"
# How often to poll for new aircraft data (milliseconds)
poll_interval_ms = 1000

# Circuit breaker configuration for PiAware resilience
[adsb.circuit_breaker]
# Number of consecutive failures before opening circuit
failure_threshold = 5
# Timeout in milliseconds before attempting recovery
timeout_ms = 30000
# Number of successes needed to close circuit from half-open state
success_threshold = 2

[database]
# SQLite database file path
path = "adsb.db"
# Enable WAL mode for better concurrency
wal_mode = true

[analysis]
# Temporal anomaly detection thresholds
# Normal aircraft: 20-30 Hz, so set thresholds much higher for true anomalies
max_messages_per_second = 100.0    # Truly excessive transmission rate
min_message_interval_ms = 10       # Very rapid individual messages
max_session_gap_seconds = 900     # 30 minutes silence before considering burst

# Signal strength anomaly thresholds (dBFS units from dump1090)
min_rssi_units = -120.0
max_rssi_units = -10.0
suspicious_rssi_units = -20.0

# Identity pattern detection (regex patterns)
suspicious_callsigns = ["TEST.*", "FAKE.*", "ANOM.*", "DEBUG.*"]
invalid_hex_patterns = ["000000", "FFFFFF", "AAAAAA", "123456"]

[alerts]
# Minimum confidence threshold for alerts (0.0 to 1.0)
confidence_threshold = 0.7
# Maximum alerts per hour to prevent spam
max_alerts_per_hour = 100
# Optional webhook URL for alert notifications (Discord/Slack)
webhook_url = ""

[web]
# Web dashboard port
port = 8080
# Dashboard title
dashboard_title = "ADS-B Anomaly Monitor"
# Map center coordinates (latitude, longitude)
# Used as fallback when no aircraft are visible
map_center_lat = 41.892368  # Chicago area
map_center_lon = -87.685569
