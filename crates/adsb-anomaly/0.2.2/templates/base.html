<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ADS-B Anomaly Detection{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'aircraft-blue': '#2c3e50',
                        'aircraft-accent': '#3498db',
                        'success-green': '#27ae60'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-aircraft-blue text-white py-4 mb-8">
        <div class="max-w-6xl mx-auto px-5">
            <ul class="flex space-x-8">
                <li><a href="/" class="hover:underline font-medium">Dashboard</a></li>
                <li><a href="/sessions" class="hover:underline font-medium">Sessions</a></li>
                <li><a href="/alerts" class="hover:underline font-medium">Alerts</a></li>
            </ul>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
