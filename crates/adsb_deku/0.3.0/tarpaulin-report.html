*key);\n            if let Some(value) = value {\n                writeln!(f, \"{}: {:?}\", key, value)?;\n            }\n        }\n        Ok(())\n    }\n}\n\nimpl Airplanes {\n    pub fn new() -\u003e Self {\n        Self(HashMap::new())\n    }\n\n    /// Add `Altitude` from adsb frame\n    pub fn add_extended_quitter_ap(\u0026mut self, icao: ICAO, frame: Frame) {\n        let airplane_coor = self.0.entry(icao).or_insert_with(AirplaneCoor::default);\n        if let DF::ADSB(adsb) = frame.df {\n            if let ME::AirbornePositionBaroAltitude(altitude) = adsb.me {\n                match altitude.odd_flag {\n                    CPRFormat::Odd =\u003e {\n                        *airplane_coor = AirplaneCoor {\n                            altitudes: [airplane_coor.altitudes[0], Some(altitude)],\n                            last_time: SystemTime::now(),\n                        };\n                    },\n                    CPRFormat::Even =\u003e {\n                        *airplane_coor = AirplaneCoor {\n                            altitudes: [Some(altitude), airplane_coor.altitudes[1]],\n                            last_time: SystemTime::now(),\n                        };\n                    },\n                }\n            }\n        }\n    }\n\n    /// Calculate latitude, longitude and altitude\n    pub fn lat_long_altitude(\u0026self, icao: ICAO) -\u003e Option\u003c(cpr::Position, u32)\u003e {\n        match self.0.get(\u0026icao) {\n            Some(altitudes) =\u003e {\n                if let (Some(first_altitude), Some(second_altitude)) =\n                    (altitudes.altitudes[0], altitudes.altitudes[1])\n                {\n                    cpr::get_position((\u0026first_altitude, \u0026second_altitude))\n                        .map(|position| (position, first_altitude.alt))\n                } else {\n                    None\n                }\n            },\n            None =\u003e None,\n        }\n    }\n\n    /// Calculate all latitude/longitude from Hashmap of current \"seen\" aircrafts\n    pub fn all_lat_long_altitude(\u0026self) -\u003e Vec\u003ccpr::Position\u003e {\n        let mut all_lat_long = vec![];\n        for altitudes in self.0.values() {\n            if let (Some(first_altitude), Some(second_altitude)) =\n                (altitudes.altitudes[0], altitudes.altitudes[1])\n            {\n                if let Some(position) = cpr::get_position((\u0026first_altitude, \u0026second_altitude))\n                    .map(|position| (position, first_altitude.alt))\n                {\n                    all_lat_long.push(position.0);\n                }\n            }\n        }\n\n        all_lat_long\n    }\n\n    /// Remove airplane after not active for a time\n    pub fn prune(\u0026mut self) {\n        self.0\n            .retain(|_, v| v.last_time.elapsed().unwrap() \u003c std::time::Duration::from_secs(60));\n    }\n}\n","traces":[{"line":17,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":19,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":20,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":29,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":30,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":31,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":32,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":33,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":36,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":41,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":42,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":46,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":47,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":48,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":49,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":50,"address":[]," ":null},{"line":106,"address":[],"length":0,"stats":{"Line":0},"fn_name":null}],"covered":0,"coverable":45},{"path":["/","home","wcampbell","projects","wcampbell","code","adsb_deku","apps","src","radar.rs"],"content":"//! This tui program displays the current ADS-B detected airplanes on a plot with your current\n//! position as (0,0) and has the ability to show different information about aircraft locations\n//! and testing your coverage.\n//!\n//! # Tabs\n//!\n//! ## ADSB\n//!\n//! Regular display of recently observed aircraft on a lat/long plot\n//!\n//! ## Coverage\n//!\n//! Instead of only showing current airplanes, only plot dots for a seen airplane location\n//!\n//! Instead of using a `HashMap` for only storing an aircraft position for each aircraft, store\n//! all aircrafts and only display a dot where detection at the lat/long position. This is for\n//! testing the reach of your antenna.\n\nuse std::io::{self, BufRead, BufReader};\nuse std::net::TcpStream;\nuse std::num::ParseFloatError;\nuse std::str::FromStr;\nuse std::time::Duration;\n\nuse adsb_deku::adsb::ME;\nuse adsb_deku::deku::DekuContainerRead;\nuse adsb_deku::{Frame, DF};\nuse apps::Airplanes;\nuse clap::Parser;\nuse crossterm::event::{poll, read, Event, KeyCode, KeyEvent};\nuse crossterm::terminal::enable_raw_mode;\nuse tui::backend::{Backend, CrosstermBackend};\nuse tui::layout::{Constraint, Direction, Layout};\nuse tui::style::{Color, Style};\nuse tui::symbols::DOT;\nuse tui::text::Spans;\nuse tui::widgets::canvas::{Canvas, Line, Points};\nuse tui::widgets::{Block, Borders, Tabs};\nuse tui::Terminal;\n\n/// Amount of zoom out from your original lat/long position\nconst MAX_PLOT_HIGH: f64 = 400.0;\nconst MAX_PLOT_LOW: f64 = MAX_PLOT_HIGH * -1.0;\n\npub struct City {\n    name: String,\n    lat: f64,\n    long: f64,\n}\n\nimpl FromStr for City {\n    type Err = ParseFloatError;\n\n    fn from_str(s: \u0026str) -\u003e Result\u003cSelf, Self::Err\u003e {\n        let coords: Vec\u003c\u0026str\u003e = s\n            .trim_matches(|p| p == '(' || p == ')')\n            .split(',')\n            .collect();\n\n        let lat_fromstr = coords[1].parse::\u003cf64\u003e()?;\n        let long_fromstr = coords[2].parse::\u003cf64\u003e()?;\n\n        Ok(Self {\n            name: coords[0].to_string(),\n            lat: lat_fromstr,\n            long: long_fromstr,\n        })\n    }\n}\n\n#[derive(Parser)]\n#[clap(\n    version,\n    name = \"radar\",\n    author = \"wcampbell0x2a\",\n    about = \"TUI Display of ADS-B protocol info from demodulator\"\n)]\nstruct Opts {\n    #[clap(long, default_value = \"localhost\")]\n    host: String,\n    #[clap(long, default_value = \"30002\")]\n    port: u16,\n    /// Antenna location latitude\n    #[clap(long)]\n    lat: f64,\n    /// Antenna location longitude\n    #[clap(long)]\n    long: f64,\n    /// Vector of cities [(name, lat, long),..]\n    #[clap(long)]\n    cities: Vec\u003cCity\u003e,\n    /// Disable output of latitude and longitude on display\n    #[clap(long)]\n    disable_lat_long: bool,\n}\n\n#[derive(Copy, Clone)]\nenum Tab {\n    Map      = 0,\n    Coverage = 1,\n}\n\nfn main() {\n    let opts = Opts::parse();\n    let original_local_lat = opts.lat;\n    let original_local_long = opts.long;\n    let mut local_lat = original_local_lat;\n    let mut local_long = original_local_long;\n    let cities = opts.cities;\n    let disable_lat_long = opts.disable_lat_long;\n\n    // Setup non-blocking TcpStream\n    let stream = TcpStream::connect((opts.host, opts.port)).unwrap();\n    stream\n        .set_read_timeout(Some(std::time::Duration::from_millis(100)))\n        .unwrap();\n    let mut reader = BufReader::new(stream);\n\n    // empty containers\n    let mut input = String::new();\n    let mut coverage_airplanes = vec![];\n    let mut adsb_airplanes = Airplanes::new();\n\n    // setup tui params\n    let stdout = io::stdout();\n    let mut backend = CrosstermBackend::new(stdout);\n    backend.clear().unwrap();\n    let mut terminal = Terminal::new(backend).unwrap();\n    enable_raw_mode().unwrap();\n\n    // setup tui variables\n    let mut tab_selection = Tab::Map;\n    let mut quit = false;\n    let original_scale = 1.2;\n    let mut scale = original_scale;\n\n    loop {\n        // if new message, add to buffers\n        if let Ok(len) = reader.read_line(\u0026mut input) {\n            if len \u003e 0 {\n                let hex = \u0026input.to_string()[1..len - 2];\n                let bytes = hex::decode(\u0026hex).unwrap();\n                if let Ok((_, frame)) = Frame::from_bytes((\u0026bytes, 0)) {\n                    if let DF::ADSB(ref adsb) = frame.df {\n                        if let ME::AirbornePositionBaroAltitude(_) = adsb.me {\n                            adsb_airplanes.add_extended_quitter_ap(adsb.icao, frame.clone());\n                        }\n                    }\n                }\n            }\n        }\n\n        // add lat_long to coverage vector\n        let all_lat_long = adsb_airplanes.all_lat_long_altitude();\n        coverage_airplanes.extend(all_lat_long);\n\n        input.clear();\n        // remove airplanes that timed-out\n        adsb_airplanes.prune();\n\n        terminal\n            .draw(|f| {\n                let chunks = Layout::default()\n                    .direction(Direction::Vertical)\n                    .margin(1)\n                    .constraints([Constraint::Min(3), Constraint::Percentage(100)].as_ref())\n                    .split(f.size());\n\n                let titles = [\"Map\", \"Coverage\"]\n                    .iter()\n                    .copied()\n                    .map(Spans::from)\n                    .collect();\n                let tab = Tabs::new(titles)\n                    .block(\n                        Block::default()\n                            .title(format!(\"({},{})\", local_lat, local_long))\n                            .borders(Borders::ALL),\n                    )\n                    .style(Style::default().fg(Color::White))\n                    .highlight_style(Style::default().fg(Color::Green))\n                    .select(tab_selection as usize)\n                    .divider(DOT);\n\n                f.render_widget(tab, chunks[0]);\n\n                match tab_selection {\n                    Tab::Map =\u003e {\n                        let canvas = Canvas::default()\n                            .block(Block::default().title(\"Map\").borders(Borders::ALL))\n                            .x_bounds([MAX_PLOT_LOW, MAX_PLOT_HIGH])\n                            .y_bounds([MAX_PLOT_LOW, MAX_PLOT_HIGH])\n                            .paint(|ctx| {\n                                ctx.layer();\n\n                                let (lat_diff, long_diff) = scale_lat_long(scale);\n\n                                // draw cities\n                                draw_cities(\n                                    ctx, \u0026cities, local_lat, local_long, lat_diff, long_diff,\n                                );\n\n                                // draw ADSB tab airplanes\n                                for key in adsb_airplanes.0.keys() {\n                                    let value = adsb_airplanes.lat_long_altitude(*key);\n                                    if let Some((position, _altitude)) = value {\n                                        let lat = ((position.latitude - local_lat) / lat_diff)\n                                            * MAX_PLOT_HIGH;\n                                        let long = ((position.longitude - local_long) / long_diff)\n                                            * MAX_PLOT_HIGH;\n\n                                        // draw dot on location\n                                        ctx.draw(\u0026Points {\n                                            coords: \u0026[(long, lat)],\n                                            color: Color::White,\n                                        });\n\n                                        let name = if disable_lat_long {\n                                            format!(\"{}\", key).into_boxed_str()\n                                        } else {\n                                            format!(\n                                                \"{} ({}, {})\",\n                                                key, position.latitude, position.longitude\n                                            )\n                                            .into_boxed_str()\n                                        };\n\n                                        // draw plane ICAO name\n                                        ctx.print(long + 3.0, lat, Box::leak(name), Color::White);\n                                    }\n                                }\n\n                                draw_lines(ctx);\n                            });\n                        f.render_widget(canvas, chunks[1]);\n                    },\n                    Tab::Coverage =\u003e {\n                        let canvas = Canvas::default()\n                            .block(Block::default().title(\"Coverage\").borders(Borders::ALL))\n                            .x_bounds([MAX_PLOT_LOW, MAX_PLOT_HIGH])\n                            .y_bounds([MAX_PLOT_LOW, MAX_PLOT_HIGH])\n                            .paint(|ctx| {\n                                ctx.layer();\n\n                                let (lat_diff, long_diff) = scale_lat_long(scale);\n\n                                // draw cities\n                                draw_cities(\n                                    ctx, \u0026cities, local_lat, local_long, lat_diff, long_diff,\n                                );\n\n                                // draw ADSB tab airplanes\n                                for position in \u0026coverage_airplanes {\n                                    let lat = ((position.latitude - local_lat) / lat_diff)\n                                        * MAX_PLOT_HIGH;\n                                    let long = ((position.longitude - local_long) / long_diff)\n                                        * MAX_PLOT_HIGH;\n\n                                    // draw dot on location\n                                    ctx.draw(\u0026Points {\n                                        coords: \u0026[(long, lat)],\n                                        color: Color::White,\n                                    });\n                                }\n\n                                draw_lines(ctx);\n                            });\n                        f.render_widget(canvas, chunks[1]);\n                    },\n                }\n            })\n            .unwrap();\n\n        // handle keyboard events\n        if poll(Duration::from_millis(100)).unwrap() {\n            if let Event::Key(KeyEvent { code, .. }) = read().unwrap() {\n                match code {\n                    KeyCode::F(1) =\u003e tab_selection = Tab::Map,\n                    KeyCode::F(2) =\u003e tab_selection = Tab::Coverage,\n                    KeyCode::Char('q') =\u003e quit = true,\n                    KeyCode::Char('-') =\u003e scale += 0.1,\n                    KeyCode::Char('+') =\u003e {\n                        if scale \u003e 0.2 {\n                            scale -= 0.1;\n                        }\n                    },\n                    KeyCode::Up =\u003e local_lat += 0.005,\n                    KeyCode::Down =\u003e local_lat -= 0.005,\n                    KeyCode::Left =\u003e local_long -= 0.03,\n                    KeyCode::Right =\u003e local_long += 0.03,\n                    KeyCode::Enter =\u003e {\n                        local_lat = original_local_lat;\n                        local_long = original_local_long;\n                        scale = original_scale;\n                    },\n                    _ =\u003e (),\n                }\n            }\n        }\n        if quit {\n            break;\n        }\n\n        /// Draw vertical and horizontal lines\n        fn draw_lines(ctx: \u0026mut tui::widgets::canvas::Context\u003c'_\u003e) {\n            ctx.draw(\u0026Line {\n                x1: MAX_PLOT_HIGH,\n                y1: 0.0,\n                x2: MAX_PLOT_LOW,\n                y2: 0.0,\n                color: Color::White,\n            });\n            ctx.draw(\u0026Line {\n                x1: 0.0,\n                y1: MAX_PLOT_HIGH,\n                x2: 0.0,\n                y2: MAX_PLOT_LOW,\n                color: Color::White,\n            });\n        }\n\n        /// Draw cities on the map\n        fn draw_cities(\n            ctx: \u0026mut tui::widgets::canvas::Context\u003c'_\u003e,\n            cities: \u0026[City],\n            local_lat: f64,\n            local_long: f64,\n            lat_diff: f64,\n            long_diff: f64,\n        ) {\n            for city in cities {\n                let lat = ((city.lat - local_lat) / lat_diff) * MAX_PLOT_HIGH;\n                let long = ((city.long - local_long) / long_diff) * MAX_PLOT_HIGH;\n\n                // draw city coor\n                ctx.draw(\u0026Points {\n                    coords: \u0026[(long, lat)],\n                    color: Color::Green,\n                });\n\n                // draw city name\n                ctx.print(\n                    long + 3.0,\n                    lat,\n                    Box::leak(city.name.to_string().into_boxed_str()),\n                    Color::Green,\n                );\n            }\n        }\n\n        fn scale_lat_long(scale: f64) -\u003e (f64, f64) {\n            // Difference between each lat point\n            let lat_diff = scale;\n            // Difference between each long point\n            let long_diff = lat_diff * 3.0;\n\n            (lat_diff, long_diff)\n        }\n    }\n}\n","traces":[{"line":54,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":55,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":56,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":60,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":61,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":63,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":64,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":65,"address":[],"length":0,"stats":{"Line":0},"fn_name":null},{"line":66,"address":[],"length":0,"stats":{"Line":0},"fn_name":null}],"covered":0,"coverable":9},{"path":["/","home","wcampbell","projects","wcampbell","code","adsb_deku","fuzz","fuzz_targets","fuzz_target_1.rs"],"content":"#![no_main]\nuse libfuzzer_sys::fuzz_target;\nuse adsb_deku::{Frame, DF};\nuse adsb_deku::deku::{DekuContainerRead};\n\nfuzz_target!(|data: \u0026[u8]| {\n    if let Ok((_, frame)) = Frame::from_bytes((\u0026data, 0)) {\n        println!(\"{}\", frame);\n        println!(\"{:?}\", frame);\n    }\n});\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","wcampbell","projects","wcampbell","code","adsb_deku","src","adsb.rs"],"content":"//! All data structures needed for parsing only [`crate::DF::ADSB`] or [`crate::DF::TisB`]\n\nuse std::fmt::Write;\n\nuse deku::bitvec::{BitSlice, Msb0};\nuse deku::prelude::*;\n\nuse crate::mode_ac::decode_id13_field;\nuse crate::{aircraft_identification_read, Altitude, CPRFormat, Capability, Sign, ICAO};\n\n/// [`crate::DF::ADSB`] || [`crate::DF::TisB`]\n#[derive(Debug, PartialEq, DekuRead, Clone)]\npub struct ADSB {\n    /// Transponder Capability\n    pub capability: Capability,\n    /// ICAO aircraft address\n    pub icao: ICAO,\n    /// Message, extended Squitter\n    pub me: ME,\n    /// Parity/Interrogator ID\n    #[deku(bits = \"24\")]\n    pub pi: u32,\n}\n\nimpl ADSB {\n    /// `to_string` with DF.id() input\n    pub(crate) fn to_string(\n        \u0026self,\n        address_type: \u0026str,\n    ) -\u003e Result\u003cString, Box\u003cdyn std::error::Error\u003e\u003e {\n        let mut f = String::new();\n        write!(\n            f,\n            \"{}\",\n            self.me\n                .to_string(self.icao, address_type, self.capability, true)\n                .unwrap()\n        )?;\n        Ok(f)\n    }\n}\n\n/// ADS-B Message, 5 first bits are known as Type Code (TC)\n///\n/// reference: ICAO 9871 (A.2.3.1)\n#[derive(Debug, PartialEq, DekuRead, Clone)]\n#[deku(type = \"u8\", bits = \"5\")]\npub enum ME {\n    #[deku(id = \"0\")]\n    NoPosition([u8; 6]),\n    #[deku(id_pat = \"1..=4\")]\n    AircraftIdentification(Identification),\n    #[deku(id_pat = \"5..=8\")]\n    SurfacePosition(SurfacePosition),\n    #[deku(id_pat = \"9..=18\")]\n    AirbornePositionBaroAltitude(Altitude),\n    #[deku(id = \"19\")]\n    AirborneVelocity(AirborneVelocity),\n    #[deku(id_pat = \"20..=22\")]\n    AirbornePositionGNSSAltitude(Altitude),\n    #[deku(id = \"23\")]\n    Reserved0([u8; 6]),\n    #[deku(id_pat = \"24\")]\n    SurfaceSystemStatus([u8; 6]),\n    #[deku(id_pat = \"25..=27\")]\n    Reserved1([u8; 6]),\n    #[deku(id = \"28\")]\n    AircraftStatus(AircraftStatus),\n    #[deku(id = \"29\")]\n    TargetStateAndStatusInformation(TargetStateAndStatusInformation),\n    #[deku(id = \"30\")]\n    AircraftOperationalCoordination([u8; 6]),\n    #[deku(id = \"31\")]\n    AircraftOperationStatus(OperationStatus),\n}\n\nimpl ME {\n    /// `to_string` with DF.id() input\n    pub(crate) fn to_string(\n        \u0026self,\n        icao: ICAO,\n        address_type: \u0026str,\n        capability: Capability,\n        is_transponder: bool,\n    ) -\u003e Result\u003cString, Box\u003cdyn std::error::Error\u003e\u003e {\n        let transponder = match is_transponder {\n            true =\u003e \" \",\n            false =\u003e \" (Non-Transponder) \",\n        };\n        let mut f = String::new();\n        match self {\n            ME::NoPosition(_) =\u003e {\n                writeln!(\n                    f,\n                    \" Extended Squitter{}No position information\",\n                    transponder\n                )?;\n                writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n                writeln!(f, \"  Air/Ground:    {}\", capability)?;\n            },\n            ME::AircraftIdentification(Identification { tc, ca, cn }) =\u003e {\n                writeln!(\n                    f,\n                    \" Extended Squitter{}Aircraft identification and category\",\n                    transponder\n                )?;\n                writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n                writeln!(f, \"  Air/Ground:    {}\", capability)?;\n                writeln!(f, \"  Ident:         {}\", cn)?;\n                writeln!(f, \"  Category:      {}{}\", tc, ca)?;\n            },\n            ME::SurfacePosition(..) =\u003e {\n                writeln!(f, \" Extended Squitter{}Surface position\", transponder)?;\n                writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n            },\n            ME::AirbornePositionBaroAltitude(altitude) =\u003e {\n                writeln!(\n                    f,\n                    \" Extended Squitter{}Airborne position (barometric altitude)\",\n                    transponder\n                )?;\n                writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n                writeln!(f, \"  Air/Ground:    {}\", capability)?;\n                write!(f, \"{}\", altitude)?;\n            },\n            ME::AirborneVelocity(airborne_velocity) =\u003e {\n                if let AirborneVelocitySubType::GroundSpeedDecoding(_) = \u0026airborne_velocity.sub_type\n                {\n                    writeln!(\n                        f,\n                        \" Extended Squitter{}Airborne velocity over ground, subsonic\",\n                        transponder\n                    )?;\n                    writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n                    writeln!(f, \"  Air/Ground:    {}\", capability)?;\n                    writeln!(\n                        f,\n                        \"  GNSS delta:    {}{} ft\",\n                        airborne_velocity.gnss_sign, airborne_velocity.gnss_baro_diff\n                    )?;\n                    if let Some((heading, ground_speed, vertical_rate)) =\n                        airborne_velocity.calculate()\n                    {\n                        writeln!(f, \"  Heading:       {}\", heading.ceil())?;\n                        writeln!(\n                            f,\n                            \"  Speed:         {} kt groundspeed\",\n                            ground_speed.floor()\n                        )?;\n                        writeln!(\n                            f,\n                            \"  Vertical rate: {} ft/min {}\",\n                            vertical_rate, airborne_velocity.vrate_src\n                        )?;\n                    } else {\n                        writeln!(f, \"  Invalid packet\")?;\n                    }\n                }\n                if let AirborneVelocitySubType::AirspeedDecoding(airspeed_decoding) =\n                    \u0026airborne_velocity.sub_type\n                {\n                    writeln!(\n                        f,\n                        \" Extended Squitter{}Airspeed and heading, subsonic\",\n                        transponder\n                    )?;\n                    writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n                    writeln!(f, \"  Air/Ground:    {}\", capability)?;\n                    writeln!(f, \"  IAS:           {} kt\", airspeed_decoding.airspeed)?;\n                    if airborne_velocity.vrate_value \u003e 0 {\n                        writeln!(\n                            f,\n                            \"  Baro rate:     {}{} ft/min\",\n                            airborne_velocity.vrate_sign,\n                            (airborne_velocity.vrate_value - 1) * 64\n                        )?;\n                    }\n                    writeln!(f, \"  NACv:          {}\", airborne_velocity.nac_v)?;\n                }\n            },\n            ME::AirbornePositionGNSSAltitude(altitude) =\u003e {\n                writeln!(\n                    f,\n                    \" Extended Squitter{}Airborne position (GNSS altitude)\",\n                    transponder\n                )?;\n                writeln!(f, \"  Address:      {} {}\", icao, address_type)?;\n                write!(f, \"{}\", altitude)?;\n            },\n            ME::Reserved0(_) | ME::Reserved1(_) =\u003e {\n                writeln!(f, \" Extended Squitter{}Unknown\", transponder)?;\n                writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n                writeln!(f, \"  Air/Ground:    {}\", capability)?;\n            },\n            ME::SurfaceSystemStatus(_) =\u003e {\n                writeln!(\n                    f,\n                    \" Extended Squitter{}Reserved for surface system status\",\n                    transponder\n                )?;\n                writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n                writeln!(f, \"  Air/Ground:    {}\", capability)?;\n            },\n            ME::AircraftStatus(AircraftStatus {\n                emergency_state,\n                squawk,\n                ..\n            }) =\u003e {\n                writeln!(\n                    f,\n                    \" Extended Squitter{}Emergency/priority status\",\n                    transponder\n                )?;\n                writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n                writeln!(f, \"  Air/Ground:    {}\", capability)?;\n                writeln!(f, \"  Squawk:        {:x?}\", squawk)?;\n                writeln!(f, \"  Emergency/priority:    {}\", emergency_state)?;\n            },\n            ME::TargetStateAndStatusInformation(target_info) =\u003e {\n                writeln!(\n                    f,\n                    \" Extended Squitter{}Target state and status (V2)\",\n                    transponder\n                )?;\n                writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n                writeln!(f, \"  Air/Ground:    {}\", capability)?;\n                writeln!(f, \"  Target State and Status:\")?;\n                writeln!(f, \"    Target altitude:   MCP, {} ft\", target_info.altitude)?;\n                writeln!(f, \"    Altimeter setting: {} millibars\", target_info.qnh)?;\n                if target_info.is_heading {\n                    writeln!(f, \"    Target heading:    {}\", target_info.heading)?;\n                }\n                if target_info.tcas {\n                    write!(f, \"    ACAS:              operational\")?;\n                    if target_info.autopilot {\n                        write!(f, \" autopilot \")?;\n                    }\n                    if target_info.vnav {\n                        write!(f, \" VNAC \")?;\n                    }\n                    if target_info.alt_hold {\n                        write!(f, \"altitude-hold \")?;\n                    }\n                    if target_info.approach {\n                        write!(f, \"approach\")?;\n                    }\n                    writeln!(f)?;\n                } else {\n                    writeln!(f, \"    ACAS:              NOT operational\")?;\n                }\n                writeln!(f, \"    NACp:              {}\", target_info.nacp)?;\n                writeln!(f, \"    NICbaro:           {}\", target_info.nicbaro)?;\n                writeln!(f, \"    SIL:               {} (per sample)\", target_info.sil)?;\n                writeln!(f, \"    QNH:               {} millibars\", target_info.qnh)?;\n            },\n            ME::AircraftOperationalCoordination(_) =\u003e {\n                writeln!(\n                    f,\n                    \" Extended Squitter{}Aircraft Operational Coordination\",\n                    transponder\n                )?;\n                writeln!(f, \"  Address:       {} {}\", icao, address_type)?;\n            },\n            ME::AircraftOperationStatus(OperationStatus::Airborne(opstatus_airborne)) =\u003e {\n                writeln!(\n                    f,\n                    \" Extended Squitter{}Aircraft operational status (airborne)\",\n                    transponder\n                )?;\n                writeln!(f, \" Address:       {} {}\", icao, address_type)?;\n                writeln!(f, \" Air/Ground:    {}\", capability)?;\n                write!(f, \" Aircraft Operational Status:\\n{}\", opstatus_airborne)?;\n            },\n            ME::AircraftOperationStatus(OperationStatus::Surface(opstatus_surface)) =\u003e {\n                writeln!(\n                    f,\n                    \" Extended Squitter{}Aircraft operational status (surface)\",\n                    transponder\n                )?;\n                writeln!(f, \" Address:       {} {}\", icao, address_type)?;\n                writeln!(f, \" Air/Ground:    {}\", capability)?;\n                write!(f, \" Aircraft Operational Status:\\n {}\", opstatus_surface)?;\n            },\n        }\n        Ok(f)\n    }\n}\n\n/// [`ME::AirborneVelocity`] \u0026\u0026 [`AirborneVelocitySubType::GroundSpeedDecoding`]\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\npub struct GroundSpeedDecoding {\n    pub ew_sign: Sign,\n    #[deku(endian = \"big\", bits = \"10\")]\n    pub ew_vel: u16,\n    pub ns_sign: Sign,\n    #[deku(endian = \"big\", bits = \"10\")]\n    pub ns_vel: u16,\n}\n\n/// [`ME::AirborneVelocity`] \u0026\u0026 [`AirborneVelocitySubType::AirspeedDecoding`]\n#[derive(Debug, PartialEq, DekuRead, Clone)]\npub struct AirspeedDecoding {\n    #[deku(bits = \"1\")]\n    pub status_heading: u8,\n    #[deku(endian = \"big\", bits = \"10\")]\n    pub mag_heading: u16,\n    #[deku(bits = \"1\")]\n    pub airspeed_type: u8,\n    #[deku(\n        endian = \"big\",\n        bits = \"10\",\n        map = \"|airspeed: u16| -\u003e Result\u003c_, DekuError\u003e {Ok(if airspeed \u003e 0 { airspeed - 1 } else { 0 })}\"\n    )]\n    pub airspeed: u16,\n}\n\n/// Aircraft Operational Status Subtype\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\n#[deku(type = \"u8\", bits = \"3\")]\npub enum OperationStatus {\n    #[deku(id = \"0\")]\n    Airborne(OperationStatusAirborne),\n    #[deku(id = \"1\")]\n    Surface(OperationStatusSurface),\n}\n\n/// [`ME::AircraftOperationStatus`] \u0026\u0026 [`OperationStatus`] == 0\n///\n/// Version 2 support only\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\npub struct OperationStatusAirborne {\n    /// CC (16 bits)\n    pub capability_class: CapabilityClassAirborne,\n\n    /// OM\n    pub operational_mode: OperationalMode,\n    /// OM last 8 bits (diff for airborne/surface)\n    reserved: u8,\n\n    pub version_number: ADSBVersion,\n\n    #[deku(bits = \"1\")]\n    pub nic_supplement_a: u8,\n\n    #[deku(bits = \"4\")]\n    pub navigational_accuracy_category: u8,\n\n    #[deku(bits = \"2\")]\n    pub geometric_vertical_accuracy: u8,\n\n    #[deku(bits = \"2\")]\n    pub source_integrity_level: u8,\n\n    #[deku(bits = \"1\")]\n    pub barometric_altitude_integrity: u8,\n\n    #[deku(bits = \"1\")]\n    pub horizontal_reference_direction: u8,\n\n    #[deku(bits = \"1\")]\n    pub sil_supplement: u8,\n\n    #[deku(bits = \"1\")]\n    pub reserved1: u8,\n}\n\nimpl std::fmt::Display for OperationStatusAirborne {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        writeln!(f, \"   Version:            {}\", self.version_number)?;\n        writeln!(f, \"   Capability classes:{}\", self.capability_class)?;\n        writeln!(f, \"   Operational modes: {}\", self.operational_mode)?;\n        writeln!(f, \"   NIC-A:              {}\", self.nic_supplement_a)?;\n        writeln!(\n            f,\n            \"   NACp:               {}\",\n            self.navigational_accuracy_category\n        )?;\n        writeln!(\n            f,\n            \"   GVA:                {}\",\n            self.geometric_vertical_accuracy\n        )?;\n        writeln!(\n            f,\n            \"   SIL:                {} (per hour)\",\n            self.source_integrity_level\n        )?;\n        writeln!(\n            f,\n            \"   NICbaro:            {}\",\n            self.barometric_altitude_integrity\n        )?;\n        if self.horizontal_reference_direction == 1 {\n            writeln!(f, \"   Heading reference:  magnetic north\")?;\n        } else {\n            writeln!(f, \"   Heading reference:  true north\")?;\n        }\n        Ok(())\n    }\n}\n\n/// [`ME::AircraftOperationStatus`]\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\npub struct CapabilityClassAirborne {\n    #[deku(bits = \"2\")]\n    pub reserved0: u8,\n\n    /// TCAS Operational\n    #[deku(bits = \"1\")]\n    pub acas: u8,\n\n    /// 1090ES IN\n    #[deku(bits = \"1\")]\n    pub cdti: u8,\n\n    #[deku(bits = \"2\")]\n    pub reserved1: u8,\n    #[deku(bits = \"1\")]\n    pub arv: u8,\n    #[deku(bits = \"1\")]\n    pub ts: u8,\n    #[deku(bits = \"2\")]\n    pub tc: u8,\n    #[deku(bits = \"6\")]\n    pub reserved2: u8,\n}\n\nimpl std::fmt::Display for CapabilityClassAirborne {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        if self.acas == 1 {\n            write!(f, \" ACAS\")?;\n        }\n        if self.cdti == 1 {\n            write!(f, \" CDTI\")?;\n        }\n        if self.arv == 1 {\n            write!(f, \" ARV\")?;\n        }\n        if self.ts == 1 {\n            write!(f, \" TS\")?;\n        }\n        if self.tc == 1 {\n            write!(f, \" TC\")?;\n        }\n        Ok(())\n    }\n}\n\n/// [`ME::AircraftOperationStatus`] \u0026\u0026 [`OperationStatus`] == 1\n///\n/// Version 2 support only\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\npub struct OperationStatusSurface {\n    /// CC (14 bits)\n    pub capability_class: CapabilityClassSurface,\n    /// CC L/W codes\n    #[deku(bits = \"4\")]\n    pub lw_codes: u8,\n\n    /// OM\n    pub operational_mode: OperationalMode,\n    /// OM last 8 bits (diff for airborne/surface)\n    // TODO: parse:\n    // http://www.anteni.net/adsb/Doc/1090-WP30-18-DRAFT_DO-260B-V42.pdf\n    // 2.2.3.2.7.2.4.7 “GPS Antenna Offset” OM Code Subfield in Aircraft Operational Status Messages\n    pub gps_antenna_offset: u8,\n\n    pub version_number: ADSBVersion,\n\n    #[deku(bits = \"1\")]\n    pub nic_supplement_a: u8,\n\n    #[deku(bits = \"4\")]\n    pub navigational_accuracy_category: u8,\n\n    #[deku(bits = \"2\")]\n    pub reserved0: u8,\n\n    #[deku(bits = \"2\")]\n    pub source_integrity_level: u8,\n\n    #[deku(bits = \"1\")]\n    pub barometric_altitude_integrity: u8,\n\n    #[deku(bits = \"1\")]\n    pub horizontal_reference_direction: u8,\n\n    #[deku(bits = \"1\")]\n    pub sil_supplement: u8,\n\n    #[deku(bits = \"1\")]\n    pub reserved1: u8,\n}\n\nimpl std::fmt::Display for OperationStatusSurface {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        writeln!(f, \"  Version:            {}\", self.version_number)?;\n        writeln!(f, \"   NIC-A:              {}\", self.nic_supplement_a)?;\n        write!(f, \"{}\", self.capability_class)?;\n        write!(f, \"   Capability classes:\")?;\n        if self.lw_codes != 0 {\n            writeln!(f, \" L/W={}\", self.lw_codes)?;\n        } else {\n            writeln!(f)?;\n        }\n        write!(f, \"   Operational modes: {}\", self.operational_mode)?;\n        writeln!(f)?;\n        writeln!(\n            f,\n            \"   NACp:               {}\",\n            self.navigational_accuracy_category\n        )?;\n        writeln!(\n            f,\n            \"   SIL:                {} (per hour)\",\n            self.source_integrity_level\n        )?;\n        writeln!(\n            f,\n            \"   NICbaro:            {}\",\n            self.barometric_altitude_integrity\n        )?;\n        if self.horizontal_reference_direction == 1 {\n            writeln!(f, \"   Heading reference:  magnetic north\")?;\n        } else {\n            writeln!(f, \"   Heading reference:  true north\")?;\n        }\n        Ok(())\n    }\n}\n\n/// [`ME::AircraftOperationStatus`]\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\npub struct CapabilityClassSurface {\n    /// 0, 0 in current version, reserved as id for later versions\n    #[deku(bits = \"2\", assert_eq = \"0\")]\n    pub reserved0: u8,\n\n    /// Position Offset Applied\n    #[deku(bits = \"1\")]\n    pub poe: u8,\n\n    /// Aircraft has ADS-B 1090ES Receive Capability\n    #[deku(bits = \"1\")]\n    pub es1090: u8,\n\n    #[deku(bits = \"2\")]\n    pub reserved1: u8,\n\n    /// Class B2 Ground Vehicle transmitting with less than 70 watts\n    #[deku(bits = \"1\")]\n    pub b2_low: u8,\n\n    /// Aircraft has ADS-B UAT Receive Capability\n    #[deku(bits = \"1\")]\n    pub uat_in: u8,\n\n    /// Nagivation Accuracy Category for Velocity\n    #[deku(bits = \"3\")]\n    pub nac_v: u8,\n\n    /// NIC Supplement used on the Surface\n    #[deku(bits = \"1\")]\n    pub nic_supplement_c: u8,\n}\n\nimpl std::fmt::Display for CapabilityClassSurface {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        writeln!(f, \"   NIC-C:              {}\", self.nic_supplement_c)?;\n        writeln!(f, \"   NACv:               {}\", self.nac_v)?;\n        Ok(())\n    }\n}\n\n/// OperationMode field not including the last 8 bits that are different for Surface/Airborne\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\npub struct OperationalMode {\n    /// (0, 0) in Version 2, reserved for other values\n    #[deku(bits = \"2\", assert_eq = \"0\")]\n    reserved: u8,\n\n    #[deku(bits = \"1\")]\n    tcas_ra_active: bool,\n\n    #[deku(bits = \"1\")]\n    ident_switch_active: bool,\n\n    #[deku(bits = \"1\")]\n    reserved_recv_atc_service: bool,\n\n    #[deku(bits = \"1\")]\n    single_antenna_flag: bool,\n\n    #[deku(bits = \"2\")]\n    system_design_assurance: u8,\n}\n\nimpl std::fmt::Display for OperationalMode {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        if self.tcas_ra_active {\n            write!(f, \" TCAS\")?;\n        }\n        if self.ident_switch_active {\n            write!(f, \" IDENT_SWITCH_ACTIVE\")?;\n        }\n        if self.reserved_recv_atc_service {\n            write!(f, \" ATC\")?;\n        }\n        if self.single_antenna_flag {\n            write!(f, \" SAF\")?;\n        }\n        if self.system_design_assurance != 0 {\n            write!(f, \" SDA={}\", self.system_design_assurance)?;\n        }\n        Ok(())\n    }\n}\n\n/// ADS-B Defined from different ICAO documents\n///\n/// reference: ICAO 9871 (5.3.2.3)\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\n#[deku(type = \"u8\", bits = \"3\")]\npub enum ADSBVersion {\n    #[deku(id = \"0\")]\n    DOC9871AppendixA,\n    #[deku(id = \"1\")]\n    DOC9871AppendixB,\n    #[deku(id = \"2\")]\n    DOC9871AppendixC,\n}\n\nimpl std::fmt::Display for ADSBVersion {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(f, \"{}\", self.deku_id().unwrap())\n    }\n}\n\n/// Control Field (B.3) for [`crate::DF::TisB`]\n///\n/// reference: ICAO 9871\n#[derive(Debug, PartialEq, DekuRead, Clone)]\n#[deku(type = \"u8\", bits = \"3\")]\n#[allow(non_camel_case_types)]\npub enum ControlField {\n    /// ADS-B Message from a non-transponder device\n    #[deku(id = \"0\")]\n    ADSB_ES_NT(ADSB_ICAO),\n\n    /// Reserved for ADS-B for ES/NT devices for alternate address space\n    #[deku(id = \"1\")]\n    ADSB_ES_NT_ALT(ADSB_ICAO),\n\n    /// Code 2, Fine Format TIS-B Message\n    #[deku(id = \"2\")]\n    TISB_FINE(ADSB_ICAO),\n\n    /// Code 3, Coarse Format TIS-B Message\n    #[deku(id = \"3\")]\n    TISB_COARSE(ADSB_ICAO),\n\n    /// Code 4, Coarse Format TIS-B Message\n    #[deku(id = \"4\")]\n    TISB_MANAGE(ADSB_ICAO),\n\n    /// Code 5, TIS-B Message for replay ADS-B Message\n    ///\n    /// Anonymous 24-bit addresses\n    #[deku(id = \"5\")]\n    TISB_ADSB_RELAY(ADSB_ICAO),\n\n    /// Code 6, TIS-B Message, Same as DF=17\n    #[deku(id = \"6\")]\n    TISB_ADSB(ADSB_ICAO),\n\n    /// Code 7, Reserved\n    #[deku(id = \"7\")]\n    Reserved(ADSB_ICAO),\n}\n\nimpl std::fmt::Display for ControlField {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self {\n            Self::ADSB_ES_NT(adsb_icao) =\u003e {\n                write!(\n                    f,\n                    \"{}\",\n                    adsb_icao\n                        .me\n                        .to_string(adsb_icao.aa, \"(ADS-B)\", Capability::AG_UNCERTAIN3, false,)\n                        .unwrap()\n                )?;\n            },\n            Self::ADSB_ES_NT_ALT(adsb_icao) =\u003e {\n                write!(\n                    f,\n                    \"{}\",\n                    adsb_icao\n                        .me\n                        .to_string(adsb_icao.aa, \"(ADS-B)\", Capability::AG_UNCERTAIN3, false,)\n                        .unwrap()\n                )?;\n            },\n            Self::TISB_FINE(adsb_icao) =\u003e {\n                write!(\n                    f,\n                    \"{}\",\n                    adsb_icao\n                        .me\n                        .to_string(adsb_icao.aa, \"(TIS-B)\", Capability::AG_UNCERTAIN3, false,)\n                        .unwrap()\n                )?;\n            },\n            Self::TISB_COARSE(adsb_icao) =\u003e {\n                write!(\n                    f,\n                    \"{}\",\n                    adsb_icao\n eet  = 1,\n}\n\nimpl Default for Unit {\n    fn default() -\u003e Self {\n        Self::Meter\n    }\n}\n\n/// Table: A-2-97\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\npub struct AircraftStatus {\n    pub sub_type: AircraftStatusType,\n    pub emergency_state: EmergencyState,\n    #[deku(\n        bits = \"13\",\n        endian = \"big\",\n        map = \"|squawk: u32| -\u003e Result\u003c_, DekuError\u003e {Ok(decode_id13_field(squawk))}\"\n    )]\n    pub squawk: u32,\n}\n\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\n#[deku(type = \"u8\", bits = \"3\")]\npub enum AircraftStatusType {\n    #[deku(id = \"0\")]\n    NoInformation,\n    #[deku(id = \"1\")]\n    EmergencyPriorityStatus,\n    #[deku(id_pat = \"_\")]\n    Reserved,\n}\n\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\n#[deku(type = \"u8\", bits = \"3\")]\npub enum EmergencyState {\n    None                 = 0,\n    General              = 1,\n    Lifeguard            = 2,\n    MinimumFuel          = 3,\n    NoCommunication      = 4,\n    UnlawfulInterference = 5,\n    DownedAircraft       = 6,\n    Reserved2            = 7,\n}\n\nimpl std::fmt::Display for EmergencyState {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        let s = match self {\n            Self::None =\u003e \"no emergency\",\n            Self::General =\u003e \"general\",\n            Self::Lifeguard =\u003e \"lifeguard\",\n            Self::MinimumFuel =\u003e \"minimum fuel\",\n            Self::NoCommunication =\u003e \"no communication\",\n            Self::UnlawfulInterference =\u003e \"unflawful interference\",\n            Self::DownedAircraft =\u003e \"downed aircraft\",\n            Self::Reserved2 =\u003e \"reserved2\",\n        };\n        write!(f, \"{}\", s)?;\n        Ok(())\n    }\n}\n\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\npub struct OperationCodeSurface {\n    #[deku(bits = \"1\")]\n    pub poe: u8,\n    #[deku(bits = \"1\")]\n    pub cdti: u8,\n    #[deku(bits = \"1\")]\n    pub b2_low: u8,\n    #[deku(bits = \"3\")]\n    pub lw: u8,\n    #[deku(bits = \"6\")]\n    pub reserved: u16,\n}\n\n#[derive(Debug, PartialEq, DekuRead, Clone)]\npub struct Identification {\n    pub tc: TypeCoding,\n    #[deku(bits = \"3\")]\n    pub ca: u8,\n    #[deku(reader = \"aircraft_identification_read(deku::rest)\")]\n    pub cn: String,\n}\n\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\n#[deku(type = \"u8\", bits = \"5\")]\npub enum TypeCoding {\n    D = 1,\n    C = 2,\n    B = 3,\n    A = 4,\n}\n\nimpl std::fmt::Display for TypeCoding {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(\n            f,\n            \"{}\",\n            match self {\n                Self::D =\u003e \"D\",\n                Self::C =\u003e \"C\",\n                Self::B =\u003e \"B\",\n                Self::A =\u003e \"A\",\n            }\n        )\n    }\n}\n\n#[derive(Copy, Clone, Debug, PartialEq, DekuRead)]\npub struct TargetStateAndStatusInformation {\n    // TODO Support V1\n    #[deku(bits = \"2\")]\n    pub subtype: u8,\n    #[deku(bits = \"1\")]\n    pub is_fms: bool,\n    #[deku(\n        bits = \"12\",\n        endian = \"big\",\n        map = \"|altitude: u32| -\u003e Result\u003c_, DekuError\u003e {Ok(if altitude \u003e 1 {(altitude - 1) * 32} else {0} )}\"\n    )]\n    pub altitude: u32,\n    #[deku(\n        bits = \"9\",\n        endian = \"big\",\n        map = \"|qnh: u32| -\u003e Result\u003c_, DekuError\u003e {if qnh == 0 { Ok(0.0) } else { Ok(800.0 + ((qnh - 1) as f32) * 0.8)}}\"\n    )]\n    pub qnh: f32,\n    #[deku(bits = \"1\")]\n    pub is_heading: bool,\n    #[deku(\n        bits = \"9\",\n        endian = \"big\",\n        map = \"|heading: u32| -\u003e Result\u003c_, DekuError\u003e {Ok(heading as f32 * 180.0 / 256.0)}\"\n    )]\n    pub heading: f32,\n    #[deku(bits = \"4\")]\n    pub nacp: u8,\n    #[deku(bits = \"1\")]\n    pub nicbaro: u8,\n    #[deku(bits = \"2\")]\n    pub sil: u8,\n    #[deku(bits = \"1\")]\n    pub mode_validity: bool,\n    #[deku(bits = \"1\")]\n    pub autopilot: bool,\n    #[deku(bits = \"1\")]\n    pub vnav: bool,\n    #[deku(bits = \"1\")]\n    pub alt_hold: bool,\n    #[deku(bits = \"1\")]\n    pub imf: bool,\n    #[deku(bits = \"1\")]\n    pub approach: bool,\n    #[deku(bits = \"1\")]\n    pub tcas: bool,\n    #[deku(bits = \"1\")]\n    pub lnav: bool,\n    #[deku(bits = \"2\")]\n    pub reserved: u8,\n}\n\n/// [`ME::AirborneVelocity`]\n#[derive(Debug, PartialEq, DekuRead, Clone)]\npub struct AirborneVelocity {\n    #[deku(bits = \"3\")]\n    pub st: u8,\n    #[deku(bits = \"5\")]\n    pub nac_v: u8,\n    #[deku(ctx = \"*st\")]\n    pub sub_type: AirborneVelocitySubType,\n    pub vrate_src: VerticalRateSource,\n    pub vrate_sign: Sign,\n    #[deku(endian = \"big\", bits = \"9\")]\n    pub vrate_value: u16,\n    #[deku(bits = \"2\")]\n    pub reverved: u8,\n    pub gnss_sign: Sign,\n    #[deku(\n        bits = \"7\",\n        map = \"|gnss_baro_diff: u16| -\u003e Result\u003c_, DekuError\u003e {Ok(if gnss_baro_diff \u003e 1 {(gnss_baro_diff - 1)* 25} else { 0 })}\"\n    )]\n    pub gnss_baro_diff: u16,\n}\n\nimpl AirborneVelocity {\n    /// Return effective (heading, ground_speed, vertical_rate) for groundspeed\n    pub fn calculate(\u0026self) -\u003e Option\u003c(f64, f64, i16)\u003e {\n        if let AirborneVelocitySubType::GroundSpeedDecoding(ground_speed) = \u0026self.sub_type {\n            let v_ew = f64::from((ground_speed.ew_vel as i16 - 1) * ground_speed.ew_sign.value());\n            let v_ns = f64::from((ground_speed.ns_vel as i16 - 1) * ground_speed.ns_sign.value());\n            let h = v_ew.atan2(v_ns) * (360.0 / (2.0 * std::f64::consts::PI));\n            let heading = if h \u003c 0.0 { h + 360.0 } else { h };\n\n            let vrate = self\n                .vrate_value\n                .checked_sub(1)\n                .and_then(|v| v. h":1,"stats":{"Line":2},"fn_name":null},{"line":282,"address":[717501],"length":1,"stats":{"Line":5},"fn_name":null},{"line":284,"address":[717515],"length":1,"stats":{"Line":2},"fn_name":null}],"covered":14,"coverable":15},{"path":["/","home","wcampbell","projects","wcampbell","code","adsb_deku","src","lib.rs"],"content":"#![doc(\n    html_logo_url = \"https://raw.githubusercontent.com/wcampbell0x2a/adsb_deku/master/media/logo.png\"\n)]\n/*!\n`adsb_deku` provides decoding for the [`ADS-B`] Downlink protocol by using the [`deku`] crate.\n\n## Downlink Format support\n|  [`DF`]  |  Name                               |  Section    |\n| -------- | ----------------------------------- | ----------- |\n| 0        | [`Short Air-Air Surveillance`]      | 3.1.2.8.2   |\n| 4        | [`Surveillance Altitude Reply`]     | 3.1.2.6.5   |\n| 5        | [`Surveillance Identity Reply`]     | 3.1.2.6.7   |\n| 11       | [`All Call Reply`]                  | 2.1.2.5.2.2 |\n| 16       | [`Long Air-Air Surveillance`]       | 3.1.2.8.3   |\n| 17       | [`Extended Squitter(ADS-B)`]        | 3.1.2.8.6   |\n| 18       | [`Extended Squitter(TIS-B)`]        | 3.1.2.8.7   |\n| 19       | [`Extended Squitter(Military)`]     | 3.1.2.8.8   |\n| 20       | [`Comm-B Altitude Reply`]           | 3.1.2.6.6   |\n| 21       | [`Comm-B Identity Reply`]           | 3.1.2.6.8   |\n| 24       | [`Comm-D`]                          | 3.1.2.7.3   |\n\n# Comm-B support\n|  BDS  |  Name                                   |  Table      |\n| ----  | --------------------------------------- | ----------- |\n| (0,0) | [`Empty`]                               |             |\n| (1,0) | [`Data Link Capability`]                | A-2-16      |\n| (2,0) | [`Aircraft Identification`]             | A-2-32      |\n\n# Example\nTo begin using `adsb_deku`, import the [`Frame`] struct as well as the trait [`deku::DekuContainerRead`].\nThis trait is re-exported for your convenience. [`Frame::from_bytes()`] provides the interface for decoding bytes\ninto adsb data.\n\n```rust\nuse hexlit::hex;\nuse adsb_deku::Frame;\nuse adsb_deku::deku::DekuContainerRead;\n\nlet bytes = hex!(\"8da2c1bd587ba2adb31799cb802b\");\nlet frame = Frame::from_bytes((\u0026bytes, 0)).unwrap().1;\nassert_eq!(\n        r#\" Extended Squitter Airborne position (barometric altitude)\n  Address:       a2c1bd (Mode S / ADS-B)\n  Air/Ground:    airborne\n  Altitude:      23650 ft barometric\n  CPR type:      Airborne\n  CPR odd flag:  even\n  CPR latitude:  (87769)\n  CPR longitude: (71577)\n\"#,\n    frame.to_string()\n);\n```\n\n# Apps\nThe [`apps/`] directory of the project repository contains programs `radar` and `1090` for showcasing\ndifferent `adsb_deku` uses. See the [`README.md`] for examples of use.\n\n[`Empty`]: crate::bds::BDS::Empty\n[`Data Link Capability`]: crate::bds::BDS::DataLinkCapability\n[`Aircraft Identification`]: crate::bds::BDS::AircraftIdentification\n[`DF`]: crate::DF\n[`Short Air-Air Surveillance`]: crate::DF::ShortAirAirSurveillance\n[`Surveillance Altitude Reply`]: crate::DF::SurveillanceAltitudeReply\n[`Surveillance Identity Reply`]: crate::DF::SurveillanceIdentityReply\n[`All Call Reply`]: crate::DF::AllCallReply\n[`Long Air-Air Surveillance`]: crate::DF::LongAirAir\n[`Extended Squitter(ADS-B)`]: crate::DF::ADSB\n[`Extended Squitter(TIS-B)`]: crate::DF::TisB\n[`Extended Squitter(Military)`]: crate::DF::ExtendedQuitterMilitaryApplication\n[`Comm-B Altitude Reply`]: crate::DF::CommBAltitudeReply\n[`Comm-B Identity Reply`]: crate::DF::CommBIdentityReply\n[`Comm-D`]: crate::DF::CommDExtendedLengthMessage\n[`apps`]: crate::Frame\n[`Frame`]: crate::Frame\n[`deku::DekuContainerRead`]: crate::deku::DekuContainerRead\n[`README.md`]: https://github.com/wcampbell0x2a/adsb_deku/blob/master/README.md\n[`apps/`]: https://github.com/wcampbell0x2a/adsb_deku/tree/master/apps\n[`ADS-B`]: https://en.wikipedia.org/wiki/Automatic_Dependent_Surveillance%E2%80%93Broadcast\n[`deku`]: https://github.com/sharksforarms/deku\n!*/\n\n// good reference: http://www.anteni.net/adsb/Doc/1090-WP30-18-DRAFT_DO-260B-V42.pdf\n//\n// Maybe always reference this in the future?\n\n/// re-export deku\npub use deku;\n\npub mod adsb;\npub mod bds;\npub mod cpr;\nmod crc;\n\nuse adsb::{ControlField, ADSB};\nuse bds::BDS;\nuse deku::bitvec::{BitSlice, Msb0};\nuse deku::prelude::*;\n\n/// Downlink ADS-B Packet\n#[derive(Debug, PartialEq, DekuRead, Clone)]\npub struct Frame {\n    /// 5 bit identifier\n    pub df: DF,\n    /// Calculated from all bits, used as ICAO for Response packets\n    #[deku(reader = \"Self::read_crc(df, deku::input_bits)\")]\n    pub crc: u32,\n}\n\nimpl Frame {\n    /// Read rest as CRC bits\n    fn read_crc\u003c'a, 'b\u003e(\n        df: \u0026'a DF,\n        rest: \u0026'b BitSlice\u003cMsb0, u8\u003e,\n    ) -\u003e Result\u003c(\u0026'b BitSlice\u003cMsb0, u8\u003e, u32), DekuError\u003e {\n        const MODES_LONG_MSG_BYTES: usize = 14;\n        const MODES_SHORT_MSG_BYTES: usize = 7;\n\n        let bit_len = if let Ok(id) = df.deku_id() {\n            if id \u0026 0x10 != 0 {\n                MODES_LONG_MSG_BYTES * 8\n            } else {\n                MODES_SHORT_MSG_BYTES * 8\n            }\n        } else {\n            // In this case, it's the DF::CommD, which has multiple ids\n            MODES_LONG_MSG_BYTES * 8\n        };\n\n        let crc = crc::modes_checksum(rest.as_raw_slice(), bit_len)?;\n        Ok((rest, crc))\n    }\n}\n\nimpl std::fmt::Display for Frame {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match \u0026self.df {\n            DF::ShortAirAirSurveillance { altitude, .. } =\u003e {\n                writeln!(f, \" Short Air-Air Surveillance\")?;\n                writeln!(f, \"  ICAO Address:  {:06x} (Mode S / ADS-B)\", self.crc)?;\n                if altitude.0 \u003e 0 {\n                    writeln!(f, \"  Air/Ground:    airborne?\")?;\n                    writeln!(f, \"  Altitude:      {} ft barometric\", altitude.0)?;\n                } else {\n                    writeln!(f, \"  Air/Ground:    ground\")?;\n                }\n            },\n            DF::SurveillanceAltitudeReply { fs, ac, .. } =\u003e {\n                writeln!(f, \" Surveillance, Altitude Reply\")?;\n                writeln!(f, \"  ICAO Address:  {:06x} (Mode S / ADS-B)\", self.crc)?;\n                writeln!(f, \"  Air/Ground:    {}\", fs)?;\n                if ac.0 \u003e 0 {\n                    writeln!(f, \"  Altitude:      {} ft barometric\", ac.0)?;\n                }\n            },\n            DF::SurveillanceIdentityReply { fs, id, .. } =\u003e {\n                writeln!(f, \" Surveillance, Identity Reply\")?;\n                writeln!(f, \"  ICAO Address:  {:06x} (Mode S / ADS-B)\", self.crc)?;\n                writeln!(f, \"  Air/Ground:    {}\", fs)?;\n                writeln!(f, \"  Identity:      {:04x}\", id.0)?;\n            },\n            DF::AllCallReply {\n                capability, icao, ..\n            } =\u003e {\n                writeln!(f, \" All Call Reply\")?;\n                writeln!(f, \"  ICAO Address:  {} (Mode S / ADS-B)\", icao)?;\n                writeln!(f, \"  Air/Ground:    {}\", capability)?;\n            },\n            DF::LongAirAir { altitude, .. } =\u003e {\n                writeln!(f, \" Long Air-Air ACAS\")?;\n                writeln!(f, \"  ICAO Address:  {:06x} (Mode S / ADS-B)\", self.crc)?;\n                // TODO the airborne? should't be static\n                if altitude.0 \u003e 0 {\n                    writeln!(f, \"  Air/Ground:    airborne?\")?;\n                    writeln!(f, \"  Baro altitude: {} ft\", altitude.0)?;\n                } else {\n                    writeln!(f, \"  Air/Ground:    ground\")?;\n                }\n            },\n            DF::ADSB(adsb) =\u003e {\n                write!(f, \"{}\", adsb.to_string(\"(Mode S / ADS-B)\").unwrap())?;\n            },\n            DF::TisB { cf, .. } =\u003e {\n                write!(f, \"{}\", cf)?;\n            },\n            // TODO\n            DF::ExtendedQuitterMilitaryApplication { .. } =\u003e {},\n            DF::CommBAltitudeReply { bds, alt, .. } =\u003e {\n                writeln!(f, \" Comm-B, Altitude Reply\")?;\n                writeln!(f, \"  ICAO Address:  {:x?} (Mode S / ADS-B)\", self.crc)?;\n                writeln!(f, \"  Altitude:      {} ft\", alt.0)?;\n                write!(f, \"  {}\", bds)?;\n            },\n            DF::CommBIdentityReply { id, bds, .. } =\u003e {\n                writeln!(f, \" Comm-B, Identity Reply\")?;\n                writeln!(f, \"    ICAO Address:  {:x?} (Mode S / ADS-B)\", self.crc)?;\n                writeln!(f, \"    Squawk:        {:x?}\", id)?;\n                write!(f, \"    {}\", bds)?;\n            },\n            DF::CommDExtendedLengthMessage { .. } =\u003e {\n                writeln!(f, \" Comm-D Extended Length Message\")?;\n                writeln!(f, \"    ICAO Address:     {:x?} (Mode S / ADS-B)\", self.crc)?;\n            },\n        }\n        Ok(())\n    }\n}\n\n/// Downlink Format (3.1.2.3.2.1.2)\n#[derive(Debug, PartialEq, DekuRead, Clone)]\n#[deku(type = \"u8\", bits = \"5\")]\npub enum DF {\n    /// 0: (Mode S) Short Air-Air Surveillance, Downlink Format 0 (3.1.2.8.2)\n    #[deku(id = \"0\")]\n    ShortAirAirSurveillance {\n        /// VS: Vertical Status\n        #[deku(bits = \"1\")]\n        vs: u8,\n        /// CC:\n        #[deku(bits = \"1\")]\n        cc: u8,\n        /// Spare\n        #[deku(bits = \"1\")]\n        unused: u8,\n        /// SL: Sensitivity level, ACAS\n        #[deku(bits = \"3\")]\n        sl: u8,\n        /// Spare\n        #[deku(bits = \"2\")]\n        unused1: u8,\n        /// RI: Reply Information\n        #[deku(bits = \"4\")]\n        ri: u8,\n        /// Spare\n        #[deku(bits = \"2\")]\n        unused2: u8,\n        /// AC: altitude code\n        altitude: AC13Field,\n        /// AP: address, parity\n        parity: ICAO,\n    },\n\n    /// 4: (Mode S) Surveillance Altitude Reply, Downlink Format 4 (3.1.2.6.5)\n    #[deku(id = \"4\")]\n    SurveillanceAltitudeReply {\n        /// FS: Flight Status\n        fs: FlightStatus,\n        /// DR: DownlinkRequest\n        dr: DownlinkRequest,\n        /// UM: Utility Message\n        um: UtilityMessage,\n        /// AC: AltitudeCode\n        ac: AC13Field,\n        /// AP: Address/Parity\n        ap: ICAO,\n    },\n\n    /// 5: (Mode S) Surveillance Identity Reply (3.1.2.6.7)\n    #[deku(id = \"5\")]\n    SurveillanceIdentityReply {\n        /// FS: Flight Status\n        fs: FlightStatus,\n        /// DR: Downlink Request\n        dr: DownlinkRequest,\n        /// UM: UtilityMessage\n        um: UtilityMessage,\n        /// ID: Identity\n        id: IdentityCode,\n        /// AP: Address/Parity\n        ap: ICAO,\n    },\n\n    /// 11: (Mode S) All-call reply, Downlink format 11 (2.1.2.5.2.2)\n    #[deku(id = \"11\")]\n    AllCallReply {\n        /// CA: Capability\n        capability: Capability,\n        /// AA: Address Announced\n        icao: ICAO,\n        /// PI: Parity/Interrogator identifier\n        p_icao: ICAO,\n    },\n\n    /// 16: (Mode S) Long Air-Air Surveillance Downlink Format 16 (3.1.2.8.3)\n    #[deku(id = \"16\")]\n    LongAirAir {\n        #[deku(bits = \"1\")]\n        vs: u8,\n        #[deku(bits = \"2\")]\n        spare1: u8,\n        #[deku(bits = \"3\")]\n        sl: u8,\n        #[deku(bits = \"2\")]\n        spare2: u8,\n        #[deku(bits = \"4\")]\n        ri: u8,\n        #[deku(bits = \"2\")]\n        spare3: u8,\n        /// AC: altitude code\n        altitude: AC13Field,\n        /// MV: message, acas\n        #[deku(count = \"7\")]\n        mv: Vec\u003cu8\u003e,\n        /// AP: address, parity\n        parity: ICAO,\n    },\n\n    /// 17: Extended Squitter, Downlink Format 17 (3.1.2.8.6)\n    ///\n    /// Civil aircraft ADS-B message\n    #[deku(id = \"17\")]\n    ADSB(ADSB),\n\n    /// 18: Extended Squitter/Supplementary, Downlink Format 18 (3.1.2.8.7)\n    ///\n    /// Non-Transponder-based ADS-B Transmitting Subsystems and TIS-B Transmitting equipment.\n    /// Equipment that cannot be interrogated.\n    ///\n    /// reference: Aeronautical Telecommunications Volume IV: Surveillance and\n    /// Collision Avoidance Systems, Fifth Edition\n    #[deku(id = \"18\")]\n    TisB {\n        /// Enum containing message\n        cf: ControlField,\n        /// PI: parity/interrogator identifier\n        pi: ICAO,\n    },\n\n    /// 19: Extended Squitter Military Application, Downlink Format 19 (3.1.2.8.8)\n    #[deku(id = \"19\")]\n    ExtendedQuitterMilitaryApplication {\n        /// Reserved\n        #[deku(bits = \"3\")]\n        af: u8,\n    },\n\n    /// 20: COMM-B Altitude Reply (3.1.2.6.6)\n    ///\n    /// TODO: Test me\n    #[deku(id = \"20\")]\n    CommBAltitudeReply {\n        /// FS: Flight Status\n        flight_status: FlightStatus,\n        /// DR: Downlink Request\n        dr: DownlinkRequest,\n        /// UM: Utility Message\n        um: UtilityMessage,\n        /// AC: Altitude Code\n        alt: AC13Field,\n        /// MB Message, Comm-B\n        bds: BDS,\n        /// AP: address/parity\n        parity: ICAO,\n    },\n\n    /// 21: COMM-B Reply, Downlink Format 21 (3.1.2.6.8)\n    #[deku(id = \"21\")]\n    CommBIdentityReply {\n        /// FS: Flight Status\n        fs: FlightStatus,\n        /// DR: Downlink Request\n        dr: DownlinkRequest,\n        /// UM: Utility Message\n        um: UtilityMessage,\n        /// ID: Identity\n        #[deku(\n            bits = \"13\",\n            endian = \"big\",\n            map = \"|squawk: u32| -\u003e Result\u003c_, DekuError\u003e {Ok(mode_ac::decode_id13_field(squawk))}\"\n        )]\n        id: u32,\n        /// MB Message, Comm-B\n        bds: BDS,\n        /// AP address/parity\n        parity: ICAO,\n    },\n\n    /// 24..=31: Comm-D(ELM), Downlink Format 24 (3.1.2.7.3)\n    #[deku(id_pat = \"24..=31\")]\n    CommDExtendedLengthMessage {\n        /// Spare - 1 bit\n        #[deku(bits = \"1\")]\n        spare: u8,\n        /// KE: control, ELM\n        ke: KE,\n        /// ND: number of D-segment\n        #[deku(bits = \"4\")]\n        nd: u8,\n        /// MD: message, Comm-D, 80 bits\n        #[deku(count = \"10\")]\n        md: Vec\u003cu8\u003e,\n        /// AP: address/parity\n        parity: ICAO,\n    },\n}\n\n/// [`DF::CommBAltitudeReply`] || ([`DF::ADSB`] \u0026\u0026 ([`adsb::ME::AirbornePositionBaroAltitude`] || [`adsb::ME::AirbornePositionGNSSAltitude`])\n#[derive(Debug, PartialEq, DekuRead, Default, Copy, Clone)]\npub struct Altitude {\n    #[deku(bits = \"5\")]\n    pub tc: u8,\n    pub ss: SurveillanceStatus,\n    #[deku(bits = \"1\")]\n    pub saf_or_imf: u8,\n    #[deku(reader = \"Self::read(deku::rest)\")]\n    pub alt: u32,\n    /// UTC sync or not\n    #[deku(bits = \"1\")]\n    pub t: bool,\n    /// Odd or even\n    pub odd_flag: CPRFormat,\n    #[deku(bits = \"17\", endian = \"big\")]\n    pub lat_cpr: u32,\n    #[deku(bits = \"17\", endian = \"big\")]\n    pub lon_cpr: u32,\n}\n\nimpl std::fmt::Display for Altitude {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        writeln!(f, \"  Altitude:      {} ft barometric\", self.alt)?;\n        writeln!(f, \"  CPR type:      Airborne\")?;\n        writeln!(f, \"  CPR odd flag:  {}\", self.odd_flag)?;\n        writeln!(f, \"  CPR latitude:  ({})\", self.lat_cpr)?;\n        writeln!(f, \"  CPR longitude: ({})\", self.lon_cpr)?;\n        Ok(())\n    }\n}\n\nimpl Altitude {\n    /// decodeAC12Field\n    fn read(rest: \u0026BitSlice\u003cMsb0, u8\u003e) -\u003e Result\u003c(\u0026BitSlice\u003cMsb0, u8\u003e, u32), DekuError\u003e {\n        let (rest, num) = u32::read(rest, (deku::ctx::Endian::Big, deku::ctx::Size::Bits(12)))?;\n\n        let q = num \u0026 0x10;\n\n        if q \u003e 0 {\n            let n = ((num \u0026 0x0fe0) \u003e\u003e 1) | (num \u0026 0x000f);\n            let n = n * 25;\n            if n \u003e 1000 {\n                Ok((rest, (n - 1000) as u32))\n            } else {\n                Ok((rest, 0))\n            }\n        } else {\n            let mut n = ((num \u0026 0x0fc0) \u003c\u003c 1) | (num \u0026 0x003f);\n            n = mode_ac::decode_id13_field(n);\n            if let Ok(n) = mode_ac::mode_a_to_mode_c(n) {\n                Ok((rest, ((n as u32) * 100)))\n            } else {\n                println!(\"error\");\n                Ok((rest, (0)))\n            }\n        }\n    }\n}\n\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\n#[deku(type = \"u8\", bits = \"2\")]\npub enum SurveillanceStatus {\n    NoCondition    = 0,\n    PermanentAlert = 1,\n    TemporaryAlert = 2,\n    SPICondition   = 3,\n}\n\nimpl Default for SurveillanceStatus {\n    fn default() -\u003e Self {\n        Self::NoCondition\n    }\n}\n\n/// Even / Odd\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\n#[deku(type = \"u8\", bits = \"1\")]\npub enum CPRFormat {\n    Even = 0,\n    Odd  = 1,\n}\n\nimpl Default for CPRFormat {\n    fn default() -\u003e Self {\n        Self::Even\n    }\n}\n\nimpl std::fmt::Display for CPRFormat {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(\n            f,\n            \"{}\",\n            match self {\n                Self::Even =\u003e \"even\",\n                Self::Odd =\u003e \"odd\",\n            }\n        )\n    }\n}\n\n/// Positive / Negative\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\n#[deku(type = \"u8\", bits = \"1\")]\npub enum Sign {\n    Positive = 0,\n    Negative = 1,\n}\n\nimpl Sign {\n    pub fn value(\u0026self) -\u003e i16 {\n        match self {\n            Self::Positive =\u003e 1,\n            Self::Negative =\u003e -1,\n        }\n    }\n}\n\nimpl std::fmt::Display for Sign {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(\n            f,\n            \"{}\",\n            match self {\n                Self::Positive =\u003e \"\",\n                Self::Negative =\u003e \"-\",\n            }\n        )\n    }\n}\n\nmod mode_ac {\n    pub fn decode_id13_field(id13_field: u32) -\u003e u32 {\n        let mut hex_gillham: u32 = 0;\n\n        if id13_field \u0026 0x1000 != 0 {\n            hex_gillham |= 0x0010;\n        } // Bit 12 = C1\n        if id13_field \u0026 0x0800 != 0 {\n            hex_gillham |= 0x1000;\n        } // Bit 11 = A1\n        if id13_field \u0026 0x0400 != 0 {\n            hex_gillham |= 0x0020;\n        } // Bit 10 = C2\n        if id13_field \u0026 0x0200 != 0 {\n            hex_gillham |= 0x2000;\n        } // Bit  9 = A2\n        if id13_field \u0026 0x0100 != 0 {\n            hex_gillham |= 0x0040;\n        } // Bit  8 = C4\n        if id13_field \u0026 0x0080 != 0 {\n            hex_gillham |= 0x4000;\n        } // Bit  7 = A4\n          //if id13_field \u0026 0x0040 != 0 {hex_gillham |= 0x0800;} // Bit  6 = X  or M\n        if id13_field \u0026 0x0020 != 0 {\n            hex_gillham |= 0x0100;\n        } // Bit  5 = B1\n        if id13_field \u0026 0x0010 != 0 {\n            hex_gillham |= 0x0001;\n        } // Bit  4 = D1 or Q\n        if id13_field \u0026 0x0008 != 0 {\n            hex_gillham |= 0x0200;\n        } // Bit  3 = B2\n        if id13_field \u0026 0x0004 != 0 {\n            hex_gillham |= 0x0002;\n        } // Bit  2 = D2\n        if id13_field \u0026 0x0002 != 0 {\n            hex_gillham |= 0x0400;\n        } // Bit  1 = B4\n        if id13_field \u0026 0x0001 != 0 {\n            hex_gillham |= 0x0004;\n        } // Bit  0 = D4\n\n        hex_gillham\n    }\n\n    pub fn mode_a_to_mode_c(mode_a: u32) -\u003e Result\u003cu32, \u0026'static str\u003e {\n        let mut five_hundreds: u32 = 0;\n        let mut one_hundreds: u32 = 0;\n\n        // check zero bits are zero, D1 set is illegal; C1,,C4 cannot be Zero\n        if (mode_a \u0026 0xffff_8889) != 0 || (mode_a \u0026 0x0000_00f0) == 0 {\n            return Err(\"Invalid altitude\");\n        }\n\n        if mode_a \u0026 0x0010 != 0 {\n            one_hundreds ^= 0x007;\n        } // C1\n        if mode_a \u0026 0x0020 != 0 {\n            one_hundreds ^= 0x003;\n        } // C2\n        if mode_a \u0026 0x0040 != 0 {\n            one_hundreds ^= 0x001;\n        } // C4\n\n        // Remove 7s from OneHundreds (Make 7-\u003e5, snd 5-\u003e7).\n        if (one_hundreds \u0026 5) == 5 {\n            one_hundreds ^= 2;\n        }\n\n        // Check for invalid codes, only 1 to 5 are valid\n        if one_hundreds \u003e 5 {\n            return Err(\"Invalid altitude\");\n        }\n\n        // if mode_a \u0026 0x0001 {five_hundreds ^= 0x1FF;} // D1 never used for altitude\n        if mode_a \u0026 0x0002 != 0 {\n            five_hundreds ^= 0x0ff;\n        } // D2\n        if mode_a \u0026 0x0004 != 0 {\n            five_hundreds ^= 0x07f;\n        } // D4\n\n        if mode_a \u0026 0x1000 != 0 {\n            five_hundreds ^= 0x03f;\n        } // A1\n        if mode_a \u0026 0x2000 != 0 {\n            five_hundreds ^= 0x01f;\n        } // A2\n        if mode_a \u0026 0x4000 != 0 {\n            five_hundreds ^= 0x00f;\n        } // A4\n\n        if mode_a \u0026 0x0100 != 0 {\n            five_hundreds ^= 0x007;\n        } // B1\n        if mode_a \u0026 0x0200 != 0 {\n            five_hundreds ^= 0x003;\n        } // B2\n        if mode_a \u0026 0x0400 != 0 {\n            five_hundreds ^= 0x001;\n        } // B4\n\n        // Correct order of one_hundreds.\n        if five_hundreds \u0026 1 != 0 \u0026\u0026 one_hundreds \u003c= 6 {\n            one_hundreds = 6 - one_hundreds;\n        }\n\n        let n = (five_hundreds * 5) + one_hundreds;\n        if n \u003e= 13 {\n            Ok(n - 13)\n        } else {\n            Err(\"Invalid altitude\")\n        }\n    }\n}\n\n/// 13 bit identity code\n#[derive(Debug, PartialEq, DekuRead, Copy, Clone)]\npub struct IdentityCode(#[deku(reader = \"Self::read(deku::rest)\")] pub u16);\n\nimpl IdentityCode {\n    fn read(rest: \u0026BitSlice\u003cMsb0, u8\u003e) -\u003e Result\u003c(\u0026BitSlice\u003cMsb0, u8\u003e, u16), DekuError\u003e {\n        let (rest, num) = u32::read(rest, (deku::ctx::Endian::Big, deku::ctx::Size::Bits(13)))?;\n\n        let c1 = (num \u0026 0b1_0000_0000_0000) \u003e\u003e 12;\n        let a1 = (num \u0026 0b0_1000_0000_0000) \u003e\u003e 11;\n        let c2 = (num \u0026 0b0_0100_0000_0000) \u003e\u003e 10;\n        let a2 = (num \u0026 0b0_0010_0000_0000) \u003e\u003e 9;\n        let c4 = (num \u0026 0b0_0001_0000_0000) \u003e\u003e 8;\n        let a4 = (num \u0026 0b0_0000_1000_0000) \u003e\u003e 7;\n        let b1 = (num \u0026 0b0_0000_0010_0000) \u003e\u003e 5;\n        let d1 = (num \u0026 0b0_0000_0001_0000) \u003e\u003e 4;\n        let b2 = (num \u0026 0b0_0000_0000_1000) \u003e\u003e 3;\n        let d2 = (num \u0026 0b0_0000_0000_0100) \u003e\u003e 2;\n        let b4 = (num \u0026 0b0_0000_0000_0010) \u003e\u003e 1;\n        let d4 = num \u0026 0b0_0000_0000_0001;\n\n        let a = a4 \u003c\u003c 2 | a2 \u003c\u003c 1 | a1;\n        let b = b4 \u003c\u003c 2 | b2 \u003c\u003c 1 | b1;\n        let c = c4 \u003c\u003c 2 | c2 \u003c\u003c 1 | c1;\n        let d = d4 \u003c\u003c 2 | d2 \u003c\u003c 1 | d1;\n\n        let num: u16 = (a \u003c\u003c 12 | b \u003c\u003c 8 | c \u003c\u003c 4 | d) as u16;\n        Ok((rest, num))\n    }\n}\n\n/// ICAO Address; Mode S transponder code\n#[derive(Debug, PartialEq, DekuRead, Hash, Eq, Copy, Clone)]\npub struct ICAO(pub [u8; 3]);\n\nimpl std::fmt::Display for ICAO {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        write!(f, \"{:02x}\", self.0[0])?;\n        write!(f, \"{:02x}\", self.0[1])?;\n        write!(f, \"{:02x}\", self.0[2])?;\n        Ok(())\n
